build:
  maxIssues: 0

letta-mobile-guardrails:
  active: true
  NoAnyType:
    active: true
  NoSelectStarInRoomDao:
    active: true
  NoProcessGlobalMutableState:
    active: true
  CancellationMustPropagate:
    active: true
  NoDetachedCoroutineLifecycle:
    active: true
  CoroutineTestGuardrails:
    active: true
  NoAdHocJsonInstance:
    active: true
  # Literal bidi / zero-width characters in any Kotlin file (SonarCloud blocks them). Zero on main.
  InvisibleOrBidiCharacter:
    active: true
  # snapshotFlow only re-emits on Snapshot state reads; a plain var read never invalidates the
  # flow (auto-follow shipped broken that way once). Zero findings on every module when enabled.
  NonObservableStateInSnapshotFlow:
    active: true
  # Ratchet: each rule below had zero findings in exactly these paths on main (2026-11-12). It runs
  # on changed files without a baseline, so a path may only join an includes list once it is clean.
  # Counts and hit lists for everything else are in the change that added them; fix, then widen.
  NoRunBlockingInProduction:
    active: true
    includes:
      - "**/core/android-data/src/**"
      - "**/core/data/src/**"
      - "**/core/ids/src/**"
      - "**/core/runtime/src/**"
      - "**/core/testutil/src/**"
      - "**/designsystem/src/**"
      - "**/desktop/src/**"
      - "**/feature-chat/src/**"
      - "**/plugin-api/src/**"
      - "**/plugin-view/src/**"
      - "**/sharedUI/src/**"
      - "**/sharedUI-devfixtures/src/**"
      - "**/web/src/**"
      - "**/avatar/core/src/**"
      - "**/avatar/renderer-rive/src/**"
      - "**/appserver-testkit/src/**"
      # Packages built with these limits from day one (n2stx); widen as more code is cleaned.
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/secrets/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/canvas/mount/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/voice/**"
  UnboundedBufferNeedsPolicy:
    active: true
    includes:
      - "**/core/android-data/src/**"
      - "**/core/data/src/**"
      - "**/core/ids/src/**"
      - "**/core/runtime/src/**"
      - "**/core/testutil/src/**"
      - "**/designsystem/src/**"
      - "**/desktop/src/**"
      - "**/feature-chat/src/**"
      - "**/plugin-api/src/**"
      - "**/plugin-api-testkit/src/**"
      - "**/plugin-view/src/**"
      - "**/sharedUI-devfixtures/src/**"
      - "**/web/src/**"
      - "**/avatar/core/src/**"
      - "**/avatar/renderer-rive/src/**"
      - "**/appserver-testkit/src/**"
      - "**/appserver-cli/src/**"
      - "**/cli/src/**"
      - "**/iroh-wrapper-cli/src/**"
      # Packages built with these limits from day one (n2stx); widen as more code is cleaned.
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/secrets/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/canvas/mount/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/voice/**"
  NoHardcodedPaddingDirection:
    active: true
    includes:
      - "**/app/src/**"
      - "**/core/**"
      - "**/designsystem/src/**"
      - "**/desktop/src/**"
      - "**/feature-chat/src/**"
      - "**/plugin-view/src/**"
      - "**/web/src/**"
      - "**/sharedUI/src/**"
    excludes:
      - "**/LettaToolCard.kt"
  NoDeprecatedBrowserUnloadEvent:
    active: true
    includes:
      - "**/app/src/**"
      - "**/core/**"
      - "**/designsystem/src/**"
      - "**/desktop/src/**"
      - "**/feature-chat/src/**"
      - "**/sharedLogic/src/**"
      - "**/sharedUI/src/**"
      - "**/web/src/**"
    excludes:
      - "**/web/Main.kt"
  NoNonAtomicStateFlowSelfCopy:
    active: true
    includes:
      - "**/core/**"
      - "**/designsystem/src/**"
      - "**/desktop/src/**"
      - "**/plugin-api/src/**"
      - "**/plugin-view/src/**"
      - "**/sharedUI/src/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/schedules/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/memory/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/secrets/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/voice/**"
  NoUnrememberedToolFactsInComposable:
    active: true
    includes:
      - "**/app/src/**"
      - "**/designsystem/src/**"
      - "**/desktop/src/**"
      - "**/feature-chat/src/**"
      - "**/web/src/**"
      - "**/sharedUI/src/**"
    excludes:
      - "**/ChatRowToolCards.kt"
  WallClockInSharedLogic:
    active: true
    includes:
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/transport/iroh/IrohConnectionSupervisor.kt"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/transport/iroh/IrohAdminRpcExecutor.kt"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/transport/iroh/IrohTurnRegistry.kt"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/secrets/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/canvas/mount/**"
      - "**/sharedLogic/src/*/kotlin/com/letta/mobile/data/voice/**"
  # Deny by default: clients keep no persistent state; shell and user state is host-held
  # (ShellStateDocument) and only `clientstore` and host packages may persist. Ratchet: these are the
  # client paths with zero findings on main (2026-11-19, 280 findings in 127 files elsewhere); a path
  # joins when its follow-up clears it. Every NEW file in a client module is checked regardless, by
  # newFileGuardrailDetekt (detekt-guardrails-new-files.yml).
