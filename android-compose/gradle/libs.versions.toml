# Shared versions for Android/KMP modules.
# Add a family here, then delete the matching literals from module build files.
# Do not bump versions in the same change that only relocates coordinates.
[versions]
# Android SDK constants — consume via libs.versions.compileSdk/minSdk/targetSdk.
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
# AGP baseline-profile producer requires 28; keep this as the only minSdk exception.
minSdkBaselineProfile = "28"

agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
coroutines = "1.11.0"
ktor = "3.5.0"
hilt = "2.59.2"

paging = "3.5.0"
konsist = "0.17.3"
archunit = "1.4.2"
junit-jupiter = "6.1.0"
junit-platform = "6.1.0"
kotlinx-serialization-json = "1.11.0"
junit4 = "4.13.2"
robolectric = "4.16.1"
# Shared test versions. feature-chat keeps newer mockk/kotest literals.
mockk = "1.14.9"
turbine = "1.2.1"
kotest = "6.1.11"
iroh = "1.1.0"
clikt = "5.1.0"
activity-compose = "1.13.0"
molecule = "2.2.0"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"
room = "2.8.4"
material = "1.14.0"
tracing = "1.2.0"
security-crypto = "1.1.0"
lifecycle = "2.9.4"
datastore = "1.3.0-alpha09"
okhttp-mockwebserver = "5.3.2"
fuzzywuzzy = "1.4.0"
androidx-espresso = "3.7.0"
androidx-uiautomator = "2.4.0-beta02"
androidx-benchmark-macro = "1.5.0-alpha06"
