<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage Letta agents and conversations from the browser.">
    <title>Letta Web</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- letta-mobile-6l2ek: the system bars take the app's own background (LettaColorTokens
         LIGHT_BACKGROUND / DARK_BACKGROUND), so the installed app reads edge to edge. -->
    <meta name="theme-color" content="#FBFCFD" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0D11" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Letta">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #FBFCFD;
            color-scheme: light dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background-color: #0B0D11; }
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <script type="module">
        import init, { IrohAppServerSession } from './iroh/letta_iroh_wasm.js';

        const sessions = new Map();
        const maxQueuedControlFrames = 256;
        const maxQueuedStreamFrames = 2048;
        let nextSessionId = 1;
        let initialization;

        const initialize = () => {
            initialization ??= init('./iroh/letta_iroh_wasm_bg.wasm');
            return initialization;
        };

        const drain = async (session, stream, queue, maxQueuedFrames) => {
            try {
                for await (const frame of stream) {
                    if (queue.length >= maxQueuedFrames) throw new Error('Iroh frame queue overflow');
                    queue.push(frame);
                }
                if (session.state === 'connected') session.state = 'disconnected';
            } catch (error) {
                if (session.state !== 'closed') {
                    session.error = String(error);
                    session.state = 'error';
                }
            }
        };

        window.irohConnect = async (ticket) => {
            await initialize();
            const native = await IrohAppServerSession.connect(ticket);
            const id = nextSessionId++;
            const session = {
                native,
                state: 'connected',
                error: null,
                control: [],
                stream: [],
                drains: [],
                relays: new Set(),
            };
            sessions.set(id, session);
            session.drains = [
                drain(session, native.take_control_events(), session.control, maxQueuedControlFrames),
                drain(session, native.take_stream_events(), session.stream, maxQueuedStreamFrames),
            ];
            return id;
        };

        window.irohSendControl = (id, payload) => {
            const session = sessions.get(id);
            if (!session || session.state !== 'connected') throw new Error('Iroh session is not connected');
            return session.native.send_control(payload);
        };
        window.irohPollControl = (id) => sessions.get(id)?.control.shift() ?? null;
        window.irohPollStream = (id) => sessions.get(id)?.stream.shift() ?? null;
        window.irohSessionState = (id) => sessions.get(id)?.state ?? 'closed';
        window.irohSessionError = (id) => sessions.get(id)?.error ?? null;
        window.irohClose = async (id) => {
            const session = sessions.get(id);
            if (!session) return;
            session.state = 'closed';
            sessions.delete(id);
            await Promise.allSettled([...session.relays].map((relayId) => window.irohRelayClose(relayId)));
            await session.native.close();
            await Promise.allSettled(session.drains);
            session.native.free();
        };

        // letta-mobile-ckmub.17.9: canvas relay streams, dialled from a session's own endpoint
        // (one endpoint, one more ALPN). Frames are the shared canvas relay protocol's text.
        const relays = new Map();
        const maxQueuedRelayFrames = 16384;
        let nextRelayId = 1;

        window.irohOpenCanvasRelay = async (sessionId) => {
            const session = sessions.get(sessionId);
            if (!session || session.state !== 'connected') throw new Error('Iroh session is not connected');
            const native = await session.native.open_canvas_relay();
            const id = nextRelayId++;
            const relay = { native, sessionId, state: 'connected', error: null, frames: [], drains: [] };
            relays.set(id, relay);
            session.relays.add(id);
            relay.drains = [drain(relay, native.take_events(), relay.frames, maxQueuedRelayFrames)];
            return id;
        };
        window.irohRelaySend = (id, payload) => {
            const relay = relays.get(id);
            if (!relay || relay.state !== 'connected') throw new Error('Canvas relay stream is not connected');
            return relay.native.send(payload);
        };
        window.irohRelayPoll = (id) => relays.get(id)?.frames.shift() ?? null;
        window.irohRelayState = (id) => relays.get(id)?.state ?? 'closed';
        window.irohRelayError = (id) => relays.get(id)?.error ?? null;
        window.irohRelayClose = async (id) => {
            const relay = relays.get(id);
            if (!relay) return;
            relay.state = 'closed';
            relays.delete(id);
            sessions.get(relay.sessionId)?.relays.delete(id);
            // A send still in flight borrows the stream; its session's endpoint close ends it then.
            try {
                relay.native.close();
            } catch (error) {
                console.warn('Canvas relay close deferred to its session', error);
                return;
            }
            await Promise.allSettled(relay.drains);
            relay.native.free();
        };
    </script>
    <script>
        // letta-mobile-2cson: installable PWA. Relative path, so it works under /letta-mobile/ too.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => navigator.serviceWorker.ready)
                    .then((registration) => registration.active?.postMessage({
                        type: 'cache-loaded-files',
                        urls: [location.href, ...performance.getEntriesByType('resource').map((entry) => entry.name)],
                    }))
                    .catch((error) => {
                        console.warn('Letta Web service worker was not registered', error);
                    });
            });
        }
    </script>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script src="letta-web.js"></script>
</body>
</html>
