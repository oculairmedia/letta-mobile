# The product's display identity: the one place to rename the app or swap its icon.
#
# Every module reads this file at build time through the `com.letta.mobile.brand` plugin
# (build-logic/src/main/kotlin/com/letta/mobile/brand/):
#   - Android: the launcher label (`app_name`, per variant) and the launcher/notification icons;
#   - desktop: Nucleus appName, description, Start Menu group, macOS dock name, the deep-link label,
#     the Windows/macOS/Linux installer icons and the window/taskbar icon;
#   - web: the page title, the install manifest's name and the favicon/PWA icons;
#   - runtime: `com.letta.mobile.brand.Brand.NAME`, generated into sharedLogic (`DisplayNames.PRODUCT` is
#     Brand.NAME), for window titles, the shell header and sidebar, notifications and pairing copy.
#
# Only display values live here. Install and update identities (Android applicationId, the desktop
# packageName and macOS bundle id, the Windows upgradeUuid, the meridian:// scheme and data
# directories) stay in the module build files, so a rename never orphans an install.

brand.name=Baken

# Launcher label suffixes. A variant name (e.g. sideloadDebug) wins over its build type (debug).
# Root-debug and sideload-debug install side by side, so they get different labels.
brand.label.debug=Dev
brand.label.sideloadDebug=Sideload

# Icon sources, relative to android-compose/. Swap an icon by replacing these files. The desktop
# .ico and .icns are packed from icon.png (rendered from icon.svg) with
# `python scripts/brand/pack_desktop_icons.py`; commit what it writes.
brand.icon.svg=branding/source/baken-app-icon-lit.svg
brand.icon.png=branding/desktop/baken.png
brand.icon.ico=branding/desktop/baken.ico
brand.icon.icns=branding/desktop/baken.icns
# Android res root added to the app's main source set (adaptive launcher + notification icon).
brand.android.res=branding/android
# Copied into the web bundle: favicon.svg at the root, the PNGs (including the maskable icon) under icons/.
brand.web.icons=branding/web
