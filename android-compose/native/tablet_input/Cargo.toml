[package]
name = "letta_tablet_input"
version = "0.1.0"
edition = "2021"
description = "JNI bridge delivering pen and stylus input to the Letta desktop canvas"
license = "MIT"
publish = false

[lib]
name = "letta_tablet_input"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"

[target.'cfg(windows)'.dependencies]
# Windows Ink (RealTimeStylus) behind a cross-platform API. AWT never reports a
# stylus — Compose Desktop has no stylus path at all — so the pen has to be read
# from the OS directly.
octotablet = "0.1"
raw-window-handle = "0.6"

[dev-dependencies]
# Only for the standalone probe example, never for the shipped library.
winit = "0.29"
