[workspace]
resolver = "3"
members = ["crates/core-proto", "crates/core-testkit", "crates/core-store", "crates/core-store-sqlite", "crates/core-log"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
proptest = "1"
hex = "0.4.3"
minicbor = { version = "=2.3.1", default-features = false, features = ["alloc"] }
lru = { version = "0.19.2", default-features = false }
core-proto = { path = "crates/core-proto" }
core-testkit = { path = "crates/core-testkit" }
core-store = { path = "crates/core-store" }
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "=2.3.0"
storekey = { version = "=0.11.0", default-features = false }
tempfile = "3"
blake3 = { version = "1.8", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
core-log = { path = "crates/core-log" }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
bytes = "1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
uuid = { version = "1.19.0", default-features = false, features = ["std", "v8"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Types such as `codec::FrameDecoder` read better with their module's name in them.
module_name_repetitions = "allow"
# Protocol prose names wire terms (NodeId, frame_part) constantly; backticking every one hurts reading.
doc_markdown = "allow"
