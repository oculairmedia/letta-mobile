[workspace]
resolver = "3"
members = ["crates/core-proto", "crates/core-testkit"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
proptest = "1"
hex = "0.4.3"
lru = { version = "0.19.2", default-features = false }
core-proto = { path = "crates/core-proto" }
core-testkit = { path = "crates/core-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Types such as `codec::FrameDecoder` read better with their module's name in them.
module_name_repetitions = "allow"
# Protocol prose names wire terms (NodeId, frame_part) constantly; backticking every one hurts reading.
doc_markdown = "allow"
