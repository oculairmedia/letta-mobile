[package]
name = "core-projection"
version = "0.1.0"
description = "R2: exports letta-code's local-backend files into the agent log (whole files, offset-checked transcript appends, memfs git objects and refs) and rebuilds a store from the log on takeover, under the H1 node-local rules, with a SHA-256 manifest check. gix for git, notify for watching. Native only."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fixture store and raw memfs commits, for this crate's and core-node's tests.
testing = []

[dependencies]
base64.workspace = true
core-log.workspace = true
core-proto.workspace = true
gix.workspace = true
hex.workspace = true
notify-debouncer-mini.workspace = true
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
core-projection = { path = ".", features = ["testing"] }
core-store.workspace = true
core-testkit.workspace = true
proptest.workspace = true
serde.workspace = true
tempfile.workspace = true

[lints]
workspace = true
