[package]
name = "core-store"
version = "0.1.0"
description = "Baken node storage SPI: Store transactions over the log, KV, blob, membership, catalog registry and feed index, plus node-local bindings. In-memory implementation and a contract suite. wasm-safe."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The contract suite every Store implementation runs (`core_store::contract`).
contract = ["dep:proptest"]

[dependencies]
core-proto.workspace = true
storekey.workspace = true
thiserror.workspace = true
proptest = { workspace = true, optional = true }

[dev-dependencies]
core-store = { path = ".", features = ["contract"] }
core-testkit.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
