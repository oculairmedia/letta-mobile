[package]
name = "core-carrier-iroh"
version = "0.1.0"
description = "The Iroh carrier: one endpoint per node, an ALPN router, the access hook in the connection hook, and node-carrier v1 lanes over QUIC streams. The only crate that depends on iroh."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
core-carrier.workspace = true
core-proto.workspace = true
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
core-carrier = { workspace = true, features = ["contract-suite"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
