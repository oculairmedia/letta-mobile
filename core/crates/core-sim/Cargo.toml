[package]
name = "core-sim"
version = "0.1.0"
description = "Deterministic N-node simulator of the Baken core: in-process nodes with stores, agent logs, membership and placement, baken/log/1 sessions over core-carrier's in-process network on tokio's paused clock, a scenario DSL, partition, crash and loss injection, and the C1 invariant checker."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-carrier.workspace = true
core-log.workspace = true
core-membership.workspace = true
core-placement.workspace = true
core-proto.workspace = true
core-store.workspace = true
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
# `test-util` gives the paused clock the simulator runs on; this crate exists only for tests.
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "io-util", "test-util"] }
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
