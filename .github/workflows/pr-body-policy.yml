name: PR body policy

# The checks that read the PR description (the "Shared implementation searched:" line, the
# web-bundle raise approval line, the "Test change reason:" line). They are cheap (~1 min) and
# depend only on the description plus the diff, so they live here instead of in android.yml:
# a description edit (CodeRabbit rewrite, adding the shared-search line) re-runs only this
# workflow instead of the ~40 min Android graph and cancelling the run in progress.
#
# Merge gating (no policy is weakened): android.yml runs the same script (scripts/ci/pr-body-policy.sh)
# as its `pr-body-gate` job on opened/synchronize/reopened, and the required `test` aggregate needs
# it. A description edit does not re-run android.yml, so on `edited` this workflow gives the verdict
# in about a minute and then re-runs the android.yml `pr-body-gate` of the same head (whatever its
# earlier result) together with its dependent `test` aggregate: a body that becomes invalid turns the
# required `test` red, and fixing it turns it green, with no push. If the android.yml run is still in
# progress GitHub cannot re-run a job of it, so the refresh waits for the run to finish first.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - "letta/**"
      - "feat/**"
      - "cursor/**"
      - "codex/**"

concurrency:
  group: pr-body-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body-policy:
    name: pr-body-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the guards can resolve the PR base and diff against it.
          fetch-depth: 0

      - name: Run the PR description checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/pr-body-policy.sh

  # Never fails the run: the verdict is the pr-body-policy job above. Runs after a failed policy
  # job too (always()): that is exactly when a previously green `test` must turn red.
  refresh-android-gate:
    name: refresh-android-gate
    needs: pr-body-policy
    if: always() && github.event.action == 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-run pr-body-gate (and the dependent test aggregate) on the same head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No android.yml run on ${HEAD_SHA}; nothing to refresh."
            exit 0
          fi
          # A job of a run in progress cannot be re-run; wait (the cancel-in-progress group of this
          # workflow lets a newer edit supersede this wait).
          while [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" != completed ]]; do
            sleep 30
          done
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("pr-body-gate"))][0].id // empty')"
          if [[ -z "$job_id" ]]; then
            echo "android.yml run ${run_id} has no pr-body-gate job; nothing to refresh."
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/rerun"
          echo "Re-ran pr-body-gate (job ${job_id}) of android.yml run ${run_id}."
