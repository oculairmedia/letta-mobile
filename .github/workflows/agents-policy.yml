name: Agents Policy Check

# Advisory semantic lint for implemented greppable AGENTS.md rules: raw hex
# colors, sharedLogic JVM APIs, and raw AlertDialog usage.
# Its findings never fail the job (continue-on-error); they surface in the
# GitHub Actions job summary for PR review. The platform-ui-gate job below is
# different: it runs with --enforce and goes red (letta-mobile-by4vm.32).

on:
  push:
    branches: [main]
    paths:
      - "android-compose/**"
      - "scripts/ci/**"
      - "AGENTS.md"
      - ".github/workflows/agents-policy.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-compose/**"
      - "scripts/ci/**"
      - "scripts/tests/platform-ui-gate-test.sh"
      - "AGENTS.md"
      - ".github/workflows/agents-policy.yml"
  workflow_dispatch:

concurrency:
  group: agents-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-policy:
    name: Advisory AGENTS.md policy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so --diff-base origin/main can resolve on PRs.
          fetch-depth: 0

      - name: Ensure origin/main is available
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin main

      - name: Run agents policy check
        id: policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/agents-policy
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/ci/agents-policy-check.sh --diff-base origin/main \
              | tee /tmp/agents-policy/findings.txt
          else
            # Full scan on main push / workflow_dispatch
            bash scripts/ci/agents-policy-check.sh \
              | tee /tmp/agents-policy/findings.txt
          fi

      - name: Publish findings to job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Agents policy check (advisory)"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Mode: diff vs \`origin/main\` (changed lines only)"
            else
              echo "Mode: full scan of \`android-compose/\`"
            fi
            echo
            echo '```'
            if [ -f /tmp/agents-policy/findings.txt ]; then
              cat /tmp/agents-policy/findings.txt
            else
              echo "(no output — check may have failed before writing findings)"
            fi
            echo '```'
            echo
            echo "_Exit code is always 0 for findings; this job uses \`continue-on-error: true\`._"
          } >> "$GITHUB_STEP_SUMMARY"

  # letta-mobile-ckmub.7 (hard cut S0), enforced by letta-mobile-by4vm.32:
  # ratchet on platform UI files under desktop/, app/, feature-*/,
  # designsystem/, web/. --enforce fails the job on PUI001 (a new @Composable
  # file not in the allowlist; never overridable) and PUI004 (an allowlist
  # line added or raised without a "Platform-UI-Reason:" line in the PR body).
  # PUI002 (an allowlisted legacy file grew past +5 lines) stays a warning for
  # now. Not a required check: it shows red honestly but does not block merge.
  platform-ui-gate:
    name: Platform UI gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test platform UI gate
        run: bash scripts/tests/platform-ui-gate-test.sh

      - name: Run platform UI gate
        env:
          # A "Platform-UI-Reason: <why>" line here justifies PUI004 (allowlist
          # add/raise) only. It never excuses PUI001.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/platform-ui
          status=0
          bash scripts/ci/platform-ui-gate.sh --diff-base "$BASE_SHA" --enforce \
            > /tmp/platform-ui/findings.txt || status=$?
          cat /tmp/platform-ui/findings.txt
          grep -E '^(ERROR|WARN)\|' /tmp/platform-ui/findings.txt \
            | while IFS='|' read -r sev rule path msg; do
                level=warning; [[ "$sev" == ERROR ]] && level=error
                echo "::${level} file=${path},title=${rule}::${msg}"
              done || true
          exit "$status"

      - name: Publish platform UI findings to job summary
        if: always()
        run: |
          {
            echo "## Platform UI gate (ckmub.7)"
            echo
            echo "All UI is shared (sharedUI); platform modules are containers. See AGENTS.md."
            echo
            echo '```'
            cat /tmp/platform-ui/findings.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "_Fails on PUI001 (new platform UI file) and on PUI004 (allowlist add/raise without a \`Platform-UI-Reason:\` line in the PR body). PUI002 growth is a warning. Not a required check._"
          } >> "$GITHUB_STEP_SUMMARY"
