name: Release

# Tag-driven release. Push a tag like `v1.2.3` to cut a release:
#   git tag -a v1.2.3 -m "release: 1.2.3"
#   git push origin v1.2.3
#
# Builds:
#   - two signed play-release APKs (the variant matrix, docs/RELEASE.md, letta-mobile-by4vm.110.8):
#       full: arm64-v8a only, WITH the embedded letta-code runtime (nodejs-mobile libnode,
#             NDK helpers, npm assets; android-compose/letta-code-runtime/letta-code-runtime.properties)
#             and the LiteRT-LM on-device model, so agents can run on the phone with no host;
#       lite: arm64-v8a + armeabi-v7a + x86_64, no embedded runtime, no LiteRT-LM (remote/desktop hosts),
#   - the Windows desktop EXE + MSI installers, and
#   - the Linux Iroh wrapper CLI distribution (the Kotlin app-server gateway
#     that meridian-iroh-wrapper.service runs), so server binaries ship with
#     every release instead of being hand-built on the host.
# Creates a GitHub Release with auto-generated notes from PRs merged since the
# previous tag, and attaches both APKs + EXE + MSI as release assets.
#
# Trigger by accident? Delete the tag (`git push --delete origin v1.2.3`)
# and the release before anyone downloads it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Android: signed play-release APKs, one per variant ──────────────────
  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # -PembedLettaCodeNative is THE variant switch: on = arm64-v8a + runtime + LiteRT-LM,
        # off = arm64-v8a/armeabi-v7a/x86_64 without either (build-logic/.../embedded/EmbeddedRuntimeAndroid.kt).
        variant: [full, lite]
    defaults:
      run:
        working-directory: android-compose
    outputs:
      tag: ${{ steps.artifact.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0  # full history so release-notes auto-generation can diff against the prior tag

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Node 22 (embedded runtime npm asset packaging)
        if: matrix.variant == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/letta-release.jks

      - name: Build signed play-release APK (${{ matrix.variant }})
        env:
          SIGNING_STORE_FILE: letta-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          EMBED: ${{ matrix.variant == 'full' }}
        run: ./gradlew :app:assemblePlayRelease -PembedLettaCodeNative="$EMBED" -PembedLettaCodeAssets="$EMBED" --build-cache

      - name: Remove signing keystore
        # Runner is ephemeral, but don't leave the decoded keystore on disk
        # any longer than necessary. `if: always()` so failure paths clean up too.
        if: always()
        run: rm -f app/letta-release.jks

      - name: Verify embedded runtime is present in the APK
        # Fail loudly if the embedded libnode .so didn't make it into the full APK —
        # a full APK without the runtime is a silent regression.
        if: matrix.variant == 'full'
        working-directory: android-compose/app/build/outputs/apk/play/release
        run: |
          set -euo pipefail
          apk=$(ls *.apk | head -n 1)
          if ! unzip -l "$apk" | grep -q 'libnode.so'; then
            echo "ERROR: libnode.so not found in $apk — embedded runtime missing from release APK"
            unzip -l "$apk" | grep -i '\.so' || true
            exit 1
          fi
          echo "OK: embedded runtime (libnode.so) present in $apk"

      - name: Verify shipped Automerge JNI and 16 KiB ELF LOAD alignment
        # Inspect the built APK, not Gradle intermediates or the upstream AAR.
        # This is a packaging/ELF check, not a device-load or license clearance claim.
        working-directory: android-compose/app/build/outputs/apk/play/release
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import struct
          import sys
          import zipfile

          full = os.environ["VARIANT"] == "full"
          # full is arm64-v8a only (by4vm.110 D2); lite adds armeabi-v7a and x86_64 (emulators).
          # 16 KiB pages only exist on 64-bit devices, so the 64-bit ABIs are the ones checked.
          expected_abis = {"arm64-v8a"} if full else {"arm64-v8a", "armeabi-v7a", "x86_64"}
          abis = ("arm64-v8a",) if full else ("arm64-v8a", "x86_64")
          jni = "libautomerge_jni_0_2_0.so"  # org.automerge:androidnative:0.0.9
          # The runtime and LiteRT-LM ship in full only (by4vm.110.8).
          variant_libs = ("libnode.so", "liblitertlm_jni.so")
          apks = glob.glob("*.apk")
          if len(apks) != 1:
              sys.exit(f"Expected exactly one release APK, found {len(apks)}: {apks}")

          with zipfile.ZipFile(apks[0]) as apk:
              names = apk.namelist()
              if len(names) != len(set(names)):
                  sys.exit("Duplicate ZIP entries in release APK")
              shipped_abis = {n.split("/")[1] for n in names if n.startswith("lib/") and n.endswith(".so")}
              if shipped_abis != expected_abis:
                  sys.exit(f"{os.environ['VARIANT']} APK must ship {sorted(expected_abis)}, ships {sorted(shipped_abis)}")
              for lib in variant_libs:
                  if full != any(n.endswith(f"/{lib}") for n in names):
                      sys.exit(f"{lib} must ship {'in' if full else 'only in the full APK, not in'} {os.environ['VARIANT']}")
              for abi in abis:
                  for lib in (jni, *variant_libs) if full else (jni,):
                      entry = f"lib/{abi}/{lib}"
                      if entry not in names:
                          sys.exit(f"Missing shipped native library: {entry}")
                  entry = f"lib/{abi}/{jni}"
                  data = apk.read(entry)
                  if data[:4] != b"\x7fELF" or data[5] != 1 or data[4] not in (1, 2):
                      sys.exit(f"Invalid little-endian ELF: {entry}")
                  is64 = data[4] == 2
                  phoff = struct.unpack_from("<Q" if is64 else "<I", data, 32 if is64 else 28)[0]
                  phentsize, phnum = struct.unpack_from("<HH", data, 54 if is64 else 42)
                  min_size = 56 if is64 else 32
                  if not phnum or phentsize < min_size or phoff + phentsize * phnum > len(data):
                      sys.exit(f"Invalid ELF program headers: {entry}")
                  loads = 0
                  for index in range(phnum):
                      offset = phoff + index * phentsize
                      if struct.unpack_from("<I", data, offset)[0] != 1:  # PT_LOAD
                          continue
                      loads += 1
                      if is64:
                          file_offset, vaddr, align = (struct.unpack_from("<Q", data, offset + n)[0]
                                                       for n in (8, 16, 48))
                      else:
                          file_offset, vaddr, align = (struct.unpack_from("<I", data, offset + n)[0]
                                                       for n in (4, 8, 28))
                      if align < 16384 or (file_offset - vaddr) % 16384:
                          sys.exit(f"16 KiB ELF LOAD alignment failed: {entry} segment {index}")
                  if not loads:
                      sys.exit(f"No PT_LOAD segments: {entry}")
                  print(f"OK: {entry} present with 16 KiB-aligned LOAD segments")
          PY

      - name: Rename APK with tag
        # letta-mobile-<tag>-full.apk / -lite.apk: same package and signature, so a phone
        # can move between them by installing the other one over it.
        id: artifact
        working-directory: android-compose/app/build/outputs/apk/play/release
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          src=$(ls *.apk | head -n 1)
          dest="letta-mobile-${tag}-${{ matrix.variant }}.apk"
          cp -f "$src" "$dest"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.variant }} APK: $(du -h "$dest" | cut -f1) ($(stat --printf='%s' "$dest") bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.variant }}
          path: android-compose/app/build/outputs/apk/play/release/letta-mobile-*-${{ matrix.variant }}.apk
          if-no-files-found: error

  # ── Desktop: Windows EXE + MSI installers ───────────────────────────────
  desktop-installers:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0  # git describe --tags for versionName

      - name: Setup Java 21 (Gradle daemon JVM)
        # See desktop.yml: foojay dropped the pinned JDK 21 package id, so the
        # Windows runner must provide JDK 21 itself for the daemon JVM.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Expose JDK 21 to Gradle's daemon-JVM resolver
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan (Kotlin/Native) toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('android-compose/gradle/wrapper/gradle-wrapper.properties', 'android-compose/sharedLogic/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache JetBrains Runtime (JBR 25.0.4) for packaged desktop runtime
        # release.yml bundles JBR 25.0.4 in the EXE/MSI runtime image (see
        # desktop/build.gradle.kts downloadDesktopJbr). The archive lands in
        # the build downloads dir under D:\l. Cache the zip so subsequent
        # release runs skip the ~180MB pull.
        uses: actions/cache@v4
        with:
          path: D:\l\downloads
          key: ${{ runner.os }}-jbr-${{ hashFiles('android-compose/desktop/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-jbr-

      - name: Cache rive-runtime build (desktop mascot renderer)
        # build-bridge.sh keeps rive-runtime's headers and release libraries (~1.7 GB, mostly
        # rive.lib) as D:\rb\work\sdk and reuses them at the pinned commit, so a hit skips the
        # clone and the ~3 min library build; the bridge itself always recompiles.
        uses: actions/cache@v4
        with:
          path: D:\rb\work\sdk
          key: ${{ runner.os }}-rive-runtime-sdk-${{ hashFiles('android-compose/avatar/renderer-rive/native/desktop/rive-runtime.version', 'android-compose/avatar/renderer-rive/native/desktop/tools/**', 'android-compose/avatar/renderer-rive/native/desktop/build-bridge.sh') }}

      - name: Build Rive desktop bridge (rive_desktop_bridge.dll)
        # The mascot renderer. Packaging refuses to run without it (desktop/build.gradle.kts,
        # stageDesktopRiveBridge), so a release installer can never silently ship orbs only.
        # Without this step :desktop:createDistributable fails on Windows — that is what broke
        # the v0.18.0 release run (#1563 added the fence and the desktop.yml step but not this one).
        shell: bash
        run: |
          bash avatar/renderer-rive/native/desktop/build-bridge.sh /d/rb/work /d/rb/out
          echo 'LETTA_RIVE_BRIDGE_DLL=D:\rb\out\rive_desktop_bridge.dll' >> "$GITHUB_ENV"

      - name: Build Windows EXE + MSI installers
        env:
          # Match desktop CI's drive-root workspace so WiX source paths stay
          # below the Win32 MAX_PATH boundary in release packaging too.
          LETTA_DESKTOP_BUILD_DIR: D:\l
        # Output:
        #   D:\l\compose\binaries\main\exe\*.exe
        #   D:\l\compose\binaries\main\msi\*.msi
        # Same packaging configuration-cache hole as desktop.yml.
        run: ./gradlew --no-configuration-cache :desktop:packageDistributionForCurrentOS

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: |
            D:\l\compose\binaries\main\exe\*.exe
            D:\l\compose\binaries\main\msi\*.msi
          if-no-files-found: error

  # ── Server: Linux Iroh wrapper CLI distribution ─────────────────────────
  server-wrapper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0  # git rev-parse stamps the dist version with the built sha

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wrapper distribution
        # The application plugin's distTar produces a self-contained tar with
        # bin/meridian-iroh-wrapper launcher + lib/ runtime jars — the same
        # layout the host release tree uses.
        run: ./gradlew :iroh-wrapper-cli:distTar --build-cache

      - name: Rename dist with tag
        working-directory: android-compose/iroh-wrapper-cli/build/distributions
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          src=$(ls meridian-iroh-wrapper-*.tar | head -n 1)
          cp -f "$src" "meridian-iroh-wrapper-${tag}-linux-x64.tar"

      - name: Upload wrapper dist
        uses: actions/upload-artifact@v4
        with:
          name: server-wrapper
          path: android-compose/iroh-wrapper-cli/build/distributions/meridian-iroh-wrapper-*-linux-x64.tar
          if-no-files-found: error

  # ── Publish: gather APK + EXE + MSI + wrapper and create the release ────
  publish:
    runs-on: ubuntu-latest
    needs: [android-apk, desktop-installers, server-wrapper]
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-apk-*
          merge-multiple: true
          path: release-assets

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: release-assets

      - name: Download server wrapper dist
        uses: actions/download-artifact@v4
        with:
          name: server-wrapper
          path: release-assets

      - name: List collected assets
        run: ls -la release-assets

      - name: Generate Nucleus Windows update metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.android-apk.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          # Any hyphen-suffixed pre-release tag publishes to a non-stable
          # updater channel so its metadata never lands on latest.yml. Nucleus
          # only serves latest/beta/alpha channel files, so labels it does not
          # define (rc, hotfix, ...) map to beta.
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            channel="$(printf '%s' "$prerelease" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z].*//')"
            case "$channel" in
              alpha|beta) ;;
              *) channel="beta" ;;
            esac
          else
            channel="latest"
          fi
          release_date="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0 | sort -z)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "No Windows installers found for updater metadata" >&2
            exit 1
          fi
          first_name="$(basename "${installers[0]}")"
          first_hash="$(openssl dgst -sha512 -binary "${installers[0]}" | openssl base64 -A)"
          {
            echo "version: ${version}"
            echo "files:"
            for installer in "${installers[@]}"; do
              name="$(basename "$installer")"
              hash="$(openssl dgst -sha512 -binary "$installer" | openssl base64 -A)"
              size="$(stat --printf='%s' "$installer")"
              echo "  - url: ${name}"
              echo "    sha512: ${hash}"
              echo "    size: ${size}"
            done
            echo "path: ${first_name}"
            echo "sha512: ${first_hash}"
            echo "releaseDate: '${release_date}'"
          } > "release-assets/${channel}.yml"

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.android-apk.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # APK lands flat; EXE/MSI keep their exe/ and msi/ subdirs from the
          # desktop artifact. Match both flat and nested so all three attach.
          files: |
            release-assets/*.apk
            release-assets/exe/*.exe
            release-assets/msi/*.msi
            release-assets/*.tar
            release-assets/*.yml
