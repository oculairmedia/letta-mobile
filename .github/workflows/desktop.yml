name: Desktop Installer

# Builds the shared :desktop Compose client on native hosts: Windows EXE/MSI
# and a Linux x86-64 AppImage with bundled JBR/Node/AppServer and Linux JNI.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
      - "scripts/desktop/**"
      - "scripts/tests/test_desktop_packaging.py"
      - "scripts/tests/desktop_smoke_fixtures.py"
      - "scripts/tests/test_linux_startup_diagnostic.py"
      - "scripts/tests/test_nucleus_hotkey.py"
      - "android-compose/build-logic/**"
      - "android-compose/letta-code-runtime/**"
      - "android-compose/sharedUI/**"
      - "android-compose/plugin-view/**"
      - "android-compose/desktop/**"
      - "android-compose/native/**"
      - "android-compose/avatar/**"
      - "android-compose/sharedLogic/**"
      - "android-compose/gradle/**"
      - "android-compose/settings.gradle.kts"
      - "android-compose/build.gradle.kts"
      - "android-compose/gradle.properties"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
      - "scripts/desktop/**"
      - "scripts/tests/test_desktop_packaging.py"
      - "scripts/tests/desktop_smoke_fixtures.py"
      - "scripts/tests/test_linux_startup_diagnostic.py"
      - "scripts/tests/test_nucleus_hotkey.py"
      - "android-compose/build-logic/**"
      - "android-compose/letta-code-runtime/**"
      - "android-compose/sharedUI/**"
      - "android-compose/plugin-view/**"
      - "android-compose/desktop/**"
      - "android-compose/native/**"
      - "android-compose/avatar/**"
      - "android-compose/sharedLogic/**"
      - "android-compose/gradle/**"
      - "android-compose/settings.gradle.kts"
      - "android-compose/build.gradle.kts"
      - "android-compose/gradle.properties"
  workflow_dispatch:

concurrency:
  group: desktop-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build.gradle.kts can resolve
          # `git describe --tags` for the versionName fallback.
          fetch-depth: 0

      - name: Setup Java 21 (Gradle daemon JVM)
        # gradle/gradle-daemon-jvm.properties requires a JDK 21 daemon. The
        # Windows runner does not expose one to Gradle's auto-detection, so
        # Gradle falls back to the pinned foojay download URL -- and foojay
        # has dropped that package id (HTTP 400 "Package id not found"),
        # failing :desktop:packageDistributionForCurrentOS. Install 21 here
        # and point Gradle at it. Java 26 (next step) stays JAVA_HOME.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Expose JDK 21 to Gradle's daemon-JVM resolver
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Android `test` is the sole PR cache writer.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore Konan (Kotlin/Native) toolchain
        id: konan
        # Restore only: the per-OS saver (android.yml shared-multiplatform on
        # Linux, api-contract-windows on Windows) owns this key on main pushes,
        # so a job needing a toolchain subset never claims the exact key.
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('android-compose/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache JetBrains Runtime (JBR 25.0.4) for packaged desktop runtime
        # desktop.yml bundles JBR 25.0.4 in the EXE/MSI runtime image (see
        # desktop/build.gradle.kts downloadDesktopJbr). The archive lands in
        # the build downloads dir under D:\l (the WiX-friendly packaging
        # workspace). Cache the zip so subsequent runs skip the ~180MB pull.
        uses: actions/cache@v4
        with:
          path: D:\l\downloads
          key: ${{ runner.os }}-jbr-${{ hashFiles('android-compose/desktop/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-jbr-

      - name: Cache rive-runtime build (desktop mascot renderer)
        # build-bridge.sh keeps rive-runtime's headers and release libraries (~1.7 GB, mostly
        # rive.lib) as D:\rb\work\sdk and reuses them at the pinned commit, so a hit skips the
        # clone and the ~3 min library build; the bridge itself always recompiles.
        uses: actions/cache@v4
        with:
          path: D:\rb\work\sdk
          key: ${{ runner.os }}-rive-runtime-sdk-${{ hashFiles('android-compose/avatar/renderer-rive/native/desktop/rive-runtime.version', 'android-compose/avatar/renderer-rive/native/desktop/tools/**', 'android-compose/avatar/renderer-rive/native/desktop/build-bridge.sh') }}

      - name: Build Rive desktop bridge (rive_desktop_bridge.dll)
        # The mascot renderer. Packaging refuses to run without it (desktop/build.gradle.kts,
        # stageDesktopRiveBridge), so an installer can never silently ship orbs only.
        shell: bash
        run: |
          bash avatar/renderer-rive/native/desktop/build-bridge.sh /d/rb/work /d/rb/out
          echo 'LETTA_RIVE_BRIDGE_DLL=D:\rb\out\rive_desktop_bridge.dll' >> "$GITHUB_ENV"

      - name: Build Windows EXE + MSI installers
        env:
          # WiX still resolves source files through MAX_PATH-limited Win32 APIs.
          # Keep this at the drive root; the bundled npm graph contains paths
          # long enough to overflow even RUNNER_TEMP/letta-desktop-build.
          LETTA_DESKTOP_BUILD_DIR: D:\l
        # Non-minified distributable: builds EXE/MSI without the ProGuard pass.
        # The *Release* variant runs proguardReleaseJars, which fails on JDK 26
        # ("can't find superclass java.lang.Object") because ProGuard can't see
        # the java.base module classes. For a testable desktop installer we want
        # the non-minified build anyway; minified release packaging is a separate
        # follow-up. Output:
        #   D:\l\compose\binaries\main\exe\*.exe
        #   D:\l\compose\binaries\main\msi\*.msi
        # Packaging still captures Gradle script objects (Nucleus jpackage tasks
        # plus JBR verify actions). :desktop:run is configuration-cache safe;
        # this entry point is not, so keep the cache off here only.
        run: ./gradlew --no-configuration-cache :desktop:packageDistributionForCurrentOS

      - name: Verify the mascot renderer is in the app image
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'D:\l\compose\binaries\main\app\*\app\resources\rive_desktop_bridge.dll' -ErrorAction SilentlyContinue
          if (-not $dll) { throw "rive_desktop_bridge.dll is missing from the packaged app resources" }
          Write-Host "Packaged $($dll.FullName) ($($dll.Length) bytes)"

      - name: Verify the installers carry only Windows x64 native code and stay in budget
        # letta-mobile-szx7v: npm 11 once installed sharp's prebuilt libvips for every platform,
        # growing the v0.23.0 MSI from 292 to 462 MB without failing anything. Fail the build
        # instead: no sharp package for another platform may reach the app image, and neither
        # installer may pass the ceiling (v0.22.0 was about 295 MB).
        shell: pwsh
        run: |
          $resources = Get-ChildItem 'D:\l\compose\binaries\main\app\*\app\resources' -Directory | Select-Object -First 1
          if (-not $resources) { throw "Packaged app resources not found" }
          $foreign = @(Get-ChildItem -LiteralPath $resources.FullName -Recurse -Directory -Force -Filter 'sharp-*' | Where-Object {
            $_.Parent.Name -eq '@img' -and @('sharp-win32-x64', 'sharp-libvips-win32-x64') -notcontains $_.Name
          })
          if ($foreign.Count -gt 0) {
            $foreign | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "$($foreign.Count) sharp packages for other platforms reached the app image"
          }
          $ceilingMb = 360
          $installers = @(Get-ChildItem 'D:\l\compose\binaries\main\exe\*.exe', 'D:\l\compose\binaries\main\msi\*.msi')
          if ($installers.Count -eq 0) { throw "No installers found" }
          $tooLarge = $false
          foreach ($installer in $installers) {
            $mb = [math]::Round($installer.Length / 1MB, 1)
            Write-Host "$($installer.Name): $mb MB (ceiling $ceilingMb MB)"
            if ($mb -gt $ceilingMb) { $tooLarge = $true }
          }
          if ($tooLarge) { throw "An installer is over the $ceilingMb MB ceiling" }

      - name: Smoke the packaged Windows app with its bundled runtime
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/desktop/windows-package-smoke.ps1') `
            -ImageRoot 'D:\l\compose\binaries\main\app' `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'windows-desktop-smoke')

      - name: Upload Windows packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-smoke-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/windows-desktop-smoke/*.log
            ${{ runner.temp }}/windows-desktop-smoke/*.jsonl
            ${{ runner.temp }}/windows-desktop-smoke/*.png
            ${{ runner.temp }}/windows-desktop-smoke/window.txt
          if-no-files-found: warn

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: letta-desktop-windows-installer-${{ github.run_number }}
          path: |
            D:\l\compose\binaries\main\exe\*.exe
            D:\l\compose\binaries\main\msi\*.msi
          if-no-files-found: error

      - name: Upload Rive desktop bridge
        uses: actions/upload-artifact@v4
        with:
          name: rive-desktop-bridge-${{ github.run_number }}
          path: D:\rb\out\rive_desktop_bridge.dll
          if-no-files-found: error

  # Portable shared Compose desktop app, built natively on Linux (not the server wrapper).
  # The pinned AppImage toolset carries GTK3 indicator libraries; no GTK2 host fallback.
  linux-desktop:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android-compose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 21 (Gradle daemon JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Java 26 (build tools; the app bundles pinned JBR 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Expose JDK 21 to Gradle's daemon-JVM resolver
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"

      - name: Setup Node for Nucleus electron-builder tooling
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Linux packaging and X11 smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang make libegl1-mesa-dev libgl1-mesa-dev gcc pkg-config patch libx11-dev libglib2.0-dev binutils gdb xvfb xauth xdotool x11-utils openbox dbus-x11 desktop-file-utils patchelf \
            libgtk-3-0 libasound2 libdbusmenu-gtk3-4 libsystemd0 libx11-6 libxext6 libxi6 libxrender1 libxtst6 \
            libfontconfig1 libfreetype6 libgl1 libegl1 libnss3 libgbm1 libxkbcommon0 \
            libnotify4 libsecret-1-0 libdbus-glib-1-2

      - name: Packaging regression fixtures
        working-directory: .
        run: |
          python3 scripts/tests/test_desktop_packaging.py
          python3 scripts/tests/test_linux_startup_diagnostic.py
          python3 scripts/tests/test_nucleus_hotkey.py

      - name: Cache pinned Linux Rive build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rive-linux
          key: ubuntu-22.04-rive-gl-${{ hashFiles('android-compose/avatar/renderer-rive/native/desktop/rive-runtime.version', 'android-compose/avatar/renderer-rive/native/desktop/build-linux.sh', 'android-compose/avatar/renderer-rive/native/desktop/tools/**') }}

      - name: Build and render Linux Rive bridge
        run: |
          bash avatar/renderer-rive/native/desktop/build-bridge.sh "$RUNNER_TEMP/rive-linux" "$RUNNER_TEMP/rive-out"
          echo "LETTA_RIVE_BRIDGE=$RUNNER_TEMP/rive-out/librive_desktop_bridge.so" >> "$GITHUB_ENV"
          python3 avatar/renderer-rive/native/desktop/smoke-linux.py \
            "$RUNNER_TEMP/rive-out/librive_desktop_bridge.so" avatar/renderer-rive/src/androidMain/res/raw/mascot.riv \
            "$RUNNER_TEMP/linux-rive-smoke"

      - name: Upload Linux Rive frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-rive-frames-${{ github.run_number }}
          path: ${{ runner.temp }}/linux-rive-smoke/
          if-no-files-found: warn

      - name: Build Linux x86-64 AppImage
        # Nucleus AppImage uses the real jpackage app image, JBR, Node and shared UI.
        # Includes the native EGL/OpenGL Rive renderer; packaging rejects a missing bridge.
        run: ./gradlew --no-configuration-cache :desktop:packageDistributionForCurrentOS

      - name: Verify the shipped Linux desktop
        id: linux-smoke
        env:
          LETTA_PACKAGE_SMOKE_EVIDENCE: ${{ runner.temp }}/linux-desktop-smoke
        run: |
          set -euo pipefail
          mapfile -d '' images < <(find desktop/build/compose/binaries/main/AppImage -maxdepth 1 -name '*.AppImage' -print0)
          test "${#images[@]}" -eq 1
          printf 'appimage=%s\n' "${images[0]}" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            LETTA_PACKAGE_SMOKE_EVIDENCE="$LETTA_PACKAGE_SMOKE_EVIDENCE/attempt-$attempt" \
              xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash ../scripts/desktop/linux-package-smoke.sh "${images[0]}"
          done

      - name: Stage the verified Linux desktop
        env:
          ARTIFACT_TAG: ci-${{ github.run_number }}
          APPIMAGE_PATH: ${{ steps.linux-smoke.outputs.appimage }}
        run: |
          set -euo pipefail
          mkdir -p desktop/build/linux-release
          name="letta-desktop-${ARTIFACT_TAG}-linux-x64.AppImage"
          cp -f "$APPIMAGE_PATH" "desktop/build/linux-release/$name"
          cd desktop/build/linux-release
          sha256sum "$name" > "$name.sha256"

      - name: Diagnose failed Linux startup with GDB
        if: ${{ failure() && steps.linux-smoke.outcome == 'failure' && steps.linux-smoke.outputs.appimage != '' }}
        # Evidence only: the original smoke step remains failed regardless of replay outcome.
        continue-on-error: true
        timeout-minutes: 3
        env:
          APPIMAGE_PATH: ${{ steps.linux-smoke.outputs.appimage }}
          LETTA_PACKAGE_X11_TRACE: "1"
          LETTA_PACKAGE_SMOKE_EVIDENCE: ${{ runner.temp }}/linux-desktop-diagnostic
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash ../scripts/desktop/linux-package-smoke.sh "$APPIMAGE_PATH"

      - name: Retain failed Linux AppImage for diagnosis only
        if: ${{ failure() && steps.linux-smoke.outcome == 'failure' && steps.linux-smoke.outputs.appimage != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unverified-linux-appimage-${{ github.run_number }}
          path: ${{ steps.linux-smoke.outputs.appimage }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload Linux GDB diagnostic evidence
        if: ${{ always() && steps.linux-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-diagnostic-${{ github.run_number }}
          path: ${{ runner.temp }}/linux-desktop-diagnostic/
          if-no-files-found: warn

      - name: Upload Linux packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/linux-desktop-smoke/
          if-no-files-found: warn

      - name: Upload Linux desktop AppImage and checksum
        uses: actions/upload-artifact@v4
        with:
          name: letta-desktop-linux-x64-${{ github.run_number }}
          path: android-compose/desktop/build/linux-release/*
          if-no-files-found: error

  # Stable status check for branch protection.
  desktop-installer-pass:
    runs-on: ubuntu-latest
    needs: [windows-installer, linux-desktop]
    if: always()
    steps:
      - name: Verify both native desktop builds succeeded
        run: |
          result="${{ needs.windows-installer.result }}"
          if [ "$result" != "success" ]; then
            echo "windows-installer did not succeed (result=$result)"
            exit 1
          fi
          echo "windows-installer succeeded"
          result="${{ needs.linux-desktop.result }}"
          if [ "$result" != "success" ]; then
            echo "linux-desktop did not succeed (result=$result)"
            exit 1
          fi
          echo "linux-desktop succeeded"
