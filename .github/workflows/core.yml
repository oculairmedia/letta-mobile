name: Rust core

# The greenfield Rust core (core/) and the contract fixtures it runs (docs/reference/contracts/).
# Not a required check; branch protection is decided separately.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - 'docs/reference/contracts/**'
      - '.github/workflows/core.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'docs/reference/contracts/**'
      - '.github/workflows/core.yml'

permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  # letta-mobile-2frn5: match the repo convention (android.yml): a newer PR
  # head supersedes the stale one's run, but a main run is never cancelled
  # mid-flight — a burst of merges must not drop a pending main verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: fmt, clippy, test, wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Matches core/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --workspace
      - name: core-proto builds for wasm32
        run: cargo build --locked -p core-proto --target wasm32-unknown-unknown
      - name: core-membership builds for wasm32
        run: cargo build --locked -p core-membership --target wasm32-unknown-unknown
      - name: core-placement builds for wasm32
        run: cargo build --locked -p core-placement --target wasm32-unknown-unknown
