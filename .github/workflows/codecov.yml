name: Codecov

# Per-PR runs removed 2026-07-31 (CI-time diet): the codecov job re-ran the
# full aggregated test suite (~10 min) that the required `test` job already
# runs. Coverage now tracks main; it is no longer a required PR check
# (branch protection updated in lockstep with this change).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codecov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  codecov:
    name: codecov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify coverage scope
        id: coverage-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_coverage=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            run_coverage=false
            if git diff --name-only "$BASE_SHA"...HEAD |
              grep -Eq '^(\.github/workflows/codecov\.yml|android-compose/)'; then
              run_coverage=true
            fi
          fi
          echo "run=$run_coverage" >> "$GITHUB_OUTPUT"
          echo "Coverage workload required: $run_coverage"

      - name: Setup Java 26
        if: steps.coverage-scope.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        if: steps.coverage-scope.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Android `test` is the sole PR writer; coverage consumes its shared
          # Gradle state without adding another 40s cache upload.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate Android SDK
        if: steps.coverage-scope.outputs.run == 'true'
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Generate aggregated Kover XML report
        if: steps.coverage-scope.outputs.run == 'true'
        run: ./gradlew --no-configuration-cache :koverXmlReportCi

      - name: Upload JVM test diagnostics
        # `always()` because the failure worth preserving is the kover task's own: a red
        # `:sharedLogic:jvmTest` skips every later step, and since per-PR runs were removed
        # this job is the only place on `main` where the full unbounded suite executes.
        # The JUnit XML carries each failure's assertion message -- the console log does
        # not, so without this a red reads only as `AssertionError at <file>:<line>` and
        # the named frame/step/invariant is unrecoverable (letta-mobile-k02zi).
        # Paths are workspace-root relative: `defaults.run.working-directory` applies to
        # `run:` steps only, never to an action's `with:` inputs.
        # `run_attempt` is part of the name because upload-artifact@v4 rejects a duplicate
        # artifact name within one run, and a re-run is how this evidence gets gathered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecov-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-compose/**/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Verify coverage report
        if: steps.coverage-scope.outputs.run == 'true'
        run: test -s build/reports/kover/report.xml

      - name: Upload coverage to Codecov
        if: steps.coverage-scope.outputs.run == 'true'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: android-compose/build/reports/kover/report.xml
          flags: kotlin
          name: kotlin-coverage
          use_oidc: true
          verbose: true
