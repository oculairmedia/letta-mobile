name: Codecov

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codecov.yml"
      - "codecov.yml"
      - "android-compose/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codecov.yml"
      - "codecov.yml"
      - "android-compose/**"
  workflow_dispatch:

concurrency:
  group: codecov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  codecov:
    name: codecov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # The root merging task cannot consume the external variants published
      # by sharedLogic's KMP graph. Generate each owned module report directly
      # and let Codecov merge the XML inputs.
      - name: Generate module Kover XML reports
        run: |
          ./gradlew --no-configuration-cache \
            :feature-chat:koverXmlReport \
            :designsystem:koverXmlReport \
            :sharedLogic:koverXmlReport

      - name: Verify coverage reports
        run: |
          test -s feature-chat/build/reports/kover/report.xml
          test -s designsystem/build/reports/kover/report.xml
          test -s sharedLogic/build/reports/kover/report.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: >-
            android-compose/feature-chat/build/reports/kover/report.xml,
            android-compose/designsystem/build/reports/kover/report.xml,
            android-compose/sharedLogic/build/reports/kover/report.xml
          flags: kotlin
          name: kotlin-coverage
          verbose: true
