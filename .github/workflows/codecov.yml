name: Codecov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codecov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  codecov:
    name: codecov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Generate aggregated Kover XML report
        run: ./gradlew --no-configuration-cache :koverXmlReportCi

      - name: Verify coverage report
        run: test -s build/reports/kover/report.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: android-compose/build/reports/kover/report.xml
          flags: kotlin
          name: kotlin-coverage
          use_oidc: true
          verbose: true
