name: Android APK CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "android-compose/**"
      - "docs/**"
      - "scripts/ci/**"
      - "scripts/tests/**"
      - "scripts/docs/**"
      - "scripts/appserver/**"
      - "*.md"
      - "scripts/bootstrap-branch-protection.sh"
  pull_request:
    # Not triggered by a description change: that (CodeRabbit rewrites, the shared-search line) used to re-run
    # this ~40 min graph and cancel the run in progress. Body checks live in pr-body-policy.yml
    # (fast feedback on edit) and the `pr-body-gate` job below (merge gate, part of `test`).
    types: [opened, synchronize, reopened]
    # Required contexts (test / build-apk-pass / shared-multiplatform) must report
    # on stacked letta/**, feat/**, cursor/** and codex/** PRs as well as main.
    # pull_request.branches filters the PR *base*, not the head — Cloud Agent
    # reviews targeting feat/* or cursor/* otherwise never get Android APK CI.
    # Do not infer those results from the base branch.
    branches:
      - main
      - "letta/**"
      - "feat/**"
      - "cursor/**"
      - "codex/**"
    # Tree hygiene must inspect every PR, including changes in previously unlisted paths.
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older PR run, but a main run is never cancelled mid-flight:
  # cancelling it left most main commits without any verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Gradle's launcher JVM loads native-platform before project gradle.properties
  # can affect the daemon. CI runs on Java 26, so acknowledge this access at the
  # workflow boundary and keep project-level flags scoped to daemon/test workers.
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
  # Bump to discard the shared Gradle User Home caches. A transient Maven Central
  # 404 (leakcanary-android .aar, 2026-10-02) was persisted into the main-written
  # cache as a missing-artifact entry and failed build-apk until it was replaced.
  # gh-v3 (2026-11-20): the same happened to kotlin-stdlib 2.3.21 / annotations 13.0 and
  # clikt / Compose runtime jars (letta-mobile-gh3gm): main runs searched only Central and
  # failed although both Central and the mirror serve them, i.e. a cached negative entry.
  GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: gh-v3

jobs:
  api-contract-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-compose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ci-speedup-pr1: the single-threaded Windows apiCheck costs 21m44s per run.
      # It re-verifies what Linux apiCheck (required `shared-multiplatform`) already
      # proves, host-independently, so PRs that touch no public-API surface skip it
      # and required-test's `WINDOWS_API_RESULT` turns green in ~1m instead of 22.
      # The Linux jobs that always run keep a moved or stale mingw_x64 dump caught
      # by scripts/ci/api-dump-mirror-check.sh in the required `test` workload.
      - name: Resolve whether the Windows API contract must run
        id: win_api
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Windows apiCheck: full run (this is not a pull request)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" 2>/dev/null \
              || git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          fi
          if ! changed="$(git diff --name-only --diff-filter=ACMRD "${base}...HEAD")"; then
            echo "Windows apiCheck: failed to diff ${base}...HEAD" >&2
            exit 1
          fi
          if grep -Eq '^android-compose/(sharedLogic|sharedUI|core/ids|core/runtime|plugin-api|gradle|build-logic)/|\.api$|^\.github/workflows/android\.yml$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Windows apiCheck: public-API/gradle/workflow paths changed vs the PR base; running." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "Windows apiCheck: skipped on this PR."
              echo "No file vs the PR base touches a public-API module (\`sharedLogic\`, \`sharedUI\`, \`core/ids\`, \`core/runtime\`, \`plugin-api\`), an \`*.api\` dump, \`android-compose/gradle/**\`, \`android-compose/build-logic/**\` or this workflow. Linux apiCheck still runs in required \`shared-multiplatform\`; main pushes always run this job in full."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Windows apiCheck: skipped (no public-API path changed vs ${base})"
          fi
      - uses: actions/setup-java@v4
        if: steps.win_api.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v4
        if: steps.win_api.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 26
      - name: Expose JDK 21 to Gradle's daemon resolver
        if: steps.win_api.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: steps.win_api.outputs.run == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
      - name: Restore Konan toolchain
        id: konan
        if: steps.win_api.outputs.run == 'true'
        # The K/N toolchain version is the catalog's kotlin version, so the key
        # is the catalog hash (letta-mobile-uwvx1). Saved only from main pushes
        # by the per-OS saver job below; PR-scoped entries would eat the quota.
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('android-compose/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Check Windows public API contracts
        if: steps.win_api.outputs.run == 'true'
        run: ./gradlew.bat --no-daemon --no-parallel --max-workers=1 "-Pkotlin.compiler.execution.strategy=in-process" apiCheck
      - name: Save Konan (Kotlin/Native) toolchain
        # Windows saver: klib apiCheck pulls the full Windows K/N toolchain.
        # success(), not always(): a failed or cancelled build must not save a
        # partial toolchain. An exact restore hit means nothing new to save, and
        # a run that skipped the apiCheck leaves the toolchain unverified.
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.konan.outputs.cache-hit != 'true' && steps.win_api.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Upload actual Windows API signatures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-windows-${{ github.sha }}
          path: |
            android-compose/**/build/kotlin/abi/**
            android-compose/**/build/api-contract/**
          if-no-files-found: warn
          retention-days: 7

  # The node's Windows bindings (process identity from PID plus creation time, the owner-only ACL
  # token file, the TCP-only tools endpoint) and the embedded desktop node only run their real code
  # on Windows; Linux CI skips those cases. Not part of required-test: it runs beside it.
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-compose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve whether the Windows node tests must run
        id: win_node
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          fi
          changed="$(git diff --name-only --diff-filter=ACMRD "${base}...HEAD")"
          if grep -Eq '^android-compose/(sharedLogic|gradle|build-logic)/|^\.github/workflows/android\.yml$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Windows node tests: skipped (no sharedLogic, gradle or workflow path changed vs ${base})." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v4
        if: steps.win_node.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v4
        if: steps.win_node.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 26
      - name: Expose JDK 21 to Gradle's daemon resolver
        if: steps.win_node.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: steps.win_node.outputs.run == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
      - name: Run the node host, tools socket and embedded node tests on Windows
        if: steps.win_node.outputs.run == 'true'
        run: >-
          ./gradlew.bat --no-daemon --max-workers=2 "-Pkotlin.compiler.execution.strategy=in-process"
          :sharedLogic:jvmTest
          --tests "com.letta.mobile.data.node.host.*"
          --tests "com.letta.mobile.data.meridian.socket.*"
          --tests "com.letta.mobile.data.node.embedded.*"
      - name: Upload Windows node test reports
        if: failure() && steps.win_node.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: node-windows-tests-${{ github.sha }}
          path: android-compose/sharedLogic/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

  test:
    name: test-workload
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so build.gradle.kts can resolve
          # `git describe --tags` for the versionName fallback on
          # untagged-main / PR builds. Shallow clone returns no tags,
          # which would force the build to fall back to "0.0.0-dev".
          fetch-depth: 0

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          # Budget: target <8 GB repository-wide under GitHub's 10 GB limit.
          # PR merge refs duplicated ~3.6 GB of dependencies/transforms; all PRs
          # read main's Gradle caches, but only main writes them. Optional heavy
          # workflows are read-only. Keep job snapshots (shared artifacts are
          # deduplicated by setup-gradle), so narrow jobs cannot replace wider ones.
          # Project-local state retains its separate same-repo-only cache below.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Cache project-local Gradle state
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@v4
        with:
          # This complements setup-gradle's Gradle User Home cache with the
          # project-local state it intentionally does not persist. Fork PRs skip
          # this cache entirely so untrusted builds cannot poison incremental
          # Kotlin/KSP/AGP state used by trusted branches.
          path: |
            android-compose/.gradle
            android-compose/.kotlin
            android-compose/**/build/intermediates/ksp
            android-compose/**/build/intermediates/incremental
          key: ${{ runner.os }}-gradle-project-v1-${{ hashFiles('android-compose/gradle/wrapper/gradle-wrapper.properties', 'android-compose/settings.gradle.kts', 'android-compose/**/*.gradle.kts', 'android-compose/gradle/libs.versions.toml', 'android-compose/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-project-v1-${{ hashFiles('android-compose/gradle/wrapper/gradle-wrapper.properties', 'android-compose/settings.gradle.kts', 'android-compose/**/*.gradle.kts', 'android-compose/gradle/libs.versions.toml', 'android-compose/gradle.properties') }}-

      - name: Restore Konan (Kotlin/Native) toolchain
        id: konan
        # Restore only: the per-OS saver (android.yml shared-multiplatform on
        # Linux, api-contract-windows on Windows) owns this key on main pushes,
        # so a job needing a toolchain subset never claims the exact key.
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('android-compose/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Test CI policy scripts
        working-directory: ${{ github.workspace }}
        run: bash scripts/tests/ci-policy-scripts-test.sh

      # letta-mobile-ewtaq: owner rule "no unshared frontend or logic". Required and never
      # advisory: no path filter or label skips it, and nothing in the PR body relaxes
      # it. Each gate prints exactly what to do; its baseline under scripts/ci/ only shrinks.
      - name: Self-test platform parity guardrails
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_parity_gates.py -v
          python3 -m unittest discover -s scripts/tests -p test_clean_arch.py -v
          bash scripts/tests/platform-ui-gate-test.sh
          bash scripts/tests/apt-install-retry-test.sh
          # A flaky upstream mirror must not fail an Android build script's tarball fetch.
          bash scripts/tests/download-with-retry-test.sh
          # A stale mingw_x64 API dump is otherwise seen only by the Windows runner.
          bash scripts/ci/api-dump-mirror-check.sh

      # letta-mobile-2frn5: the desktop packaging script contracts self-test on
      # every PR. They used to ride desktop.yml's pull_request runs, which no
      # longer exist (packaging is main + dispatch); the required test job keeps
      # them blocking before merge. Pure Python, ~25s, no Gradle.
      - name: Self-test desktop packaging scripts
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_desktop_packaging*.py' -v
          python3 scripts/tests/test_linux_startup_diagnostic.py
          python3 scripts/tests/test_nucleus_hotkey.py

      - name: Enforce platform parity guardrails
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/ci/parity_gates.py || status=1
          python3 scripts/ci/clean_arch.py --base "${CLEAN_ARCH_BASE:-$(git rev-parse HEAD^)}" || status=1
          bash scripts/ci/platform-ui-gate.sh --enforce > /tmp/platform-ui.txt || status=1
          cat /tmp/platform-ui.txt
          grep -E '^ERROR\|' /tmp/platform-ui.txt | while IFS='|' read -r _ rule path msg; do
            echo "::error file=${path},title=${rule}::${msg}"
          done || true
          exit "$status"
        env:
          CLEAN_ARCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Enforce API package documentation contract
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_api_package_coverage.py -v
          python3 scripts/ci/check-api-package-coverage.py
          python3 -m unittest discover -s scripts/tests -p test_kdoc_hygiene.py -v
          python3 scripts/ci/check-kdoc-hygiene.py
          python3 -m unittest discover -s scripts/tests -p test_changed_kotlin_code.py -v

      # The Android app packages a vendored, 16 KB-realigned arm64 libiroh_ffi.so instead of the
      # iroh-android artifact's, so an `iroh` bump must re-vendor it; JVM tests cannot catch a
      # stale copy (they load the desktop library), and the device fails every Iroh dial.
      - name: Vendored Android iroh native matches the iroh pin
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_vendored_iroh_native.py' -v
          python3 scripts/ci/check-vendored-iroh-native.py

      - name: Enforce stateful mock isolation
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/stateful-mock-gate.sh

      # README/CONTRIBUTING/CLAUDE/AGENTS must name every Gradle module, list the
      # branch-protection gates, cite real modules in task paths, keep relative
      # links resolving, and quote the wrapper's Gradle version.
      - name: Check docs match the tree
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/docs-freshness-check.py

      - name: Check generated documentation
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_documentation_index.py -v
          python3 scripts/docs/documentation-index.py --check
          node --test scripts/appserver/generate-protocol-reference.test.mjs
          node --test scripts/appserver/letta-code-upgrade.test.mjs
          node --test android-compose/letta-code-runtime/patches/check-no-static-cursor-import.test.mjs
          node scripts/appserver/verify-v2-audit-doc.mjs

      # Additive module tests: the unit tests of every module a PR touches and of every
      # module that depends on it, in addition to the base set (all of them on push).
      # Never used to skip :sharedLogic:allTests — that stays in shared-multiplatform.
      # Diff against the GitHub PR base, not origin/main. Stacked PRs otherwise
      # re-run every additive module from lower layers (e.g. designsystem on a
      # conversations-only PR) and let unrelated flakes fail required `test`.
      - name: Ensure PR base for module-diff
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify -q "${BASE_SHA}^{commit}" >/dev/null; then
            exit 0
          fi
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" 2>/dev/null \
            || git fetch --no-tags origin "${BASE_REF}"

      - name: Self-test baseline ratchet guard
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/ci -p 'test_baseline_ratchet_guard.py' -v

      - name: Reject raised parity and detekt baselines
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/baseline-ratchet-guard.py --diff-base "$BASE_SHA"

      - name: Test tree hygiene and bundle raise guards
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/ci -p 'test_gate_hygiene.py' -v

      - name: Test hang diagnostics omit process argv
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/ci -p 'test_gradle_hang_watchdog.py' -v

      - name: Enforce tree hygiene
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/tree-hygiene.py --diff-base "$BASE_SHA"

      - name: Test the test-weakening guard
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/tests -p test_test_weakening_guard.py -v

      # Every push to main runs the full additive set; a PR runs the changed modules and,
      # transitively, every module that depends on them (letta-mobile-l8lcn).
      # --group android (ci-speedup-pr2): the additive :sharedUI:jvmTest and
      # :desktop:test suites run in the parallel shared-ui-desktop-tests job, so
      # this runner keeps only the Android/CLI/architecture half of the set.
      - name: Resolve additive module tests
        id: additive_modules
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != pull_request ]]; then
            tasks="$(./scripts/ci/changed-gradle-modules.sh --all --group android)"
            echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
            echo "Full additive Gradle tasks on ${EVENT_NAME}: ${tasks}"
            exit 0
          fi
          if git rev-parse --verify -q "${BASE_SHA}^{commit}" >/dev/null; then
            base="${BASE_SHA}"
          else
            base="origin/${BASE_REF}"
          fi
          tasks="$(./scripts/ci/changed-gradle-modules.sh --group android "$base")"
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
          if [ -n "${tasks}" ]; then
            echo "Additive Gradle tasks vs ${base}: ${tasks}"
          else
            echo "No additive module tests for this diff vs ${base}"
          fi

      # One Gradle invocation gives project parallelism the complete task graph,
      # avoids repeated configuration, and reuses compiled outputs immediately.
      # Root debug is compiled by testRootDebugUnitTest; Play is compiled by the
      # required play-release APK job. Sideload is the only unique flavor compile.
      # Architecture guardrails stay inside the required `test` job.
      # checkArchitectureBoundaries reads the exported module graph and fails on
      # edges into :app, feature->feature, shell->shell, library->feature and
      # multiplatform->single-platform edges not in architecture-tests/boundary-baseline.txt
      # (letta-mobile-o4ygk.1). :build-logic:test proves each rule on synthetic graphs.
      # apiCheck moved to required `shared-multiplatform` (ci-speedup-pr1): here it
      # dragged :sharedLogic:compileKotlinWasmJs/compileKotlinHostNative (+3m09s)
      # onto the Android test runner; the shared job compiles those targets anyway
      # and pushes the same abi dumps (api-contract artifact).
      # ci-speedup-pr2: :app:testScreenshot left this graph. It matches zero test
      # classes (PR #2661: app/src/test has no *ScreenshotTest; the real screenshot
      # suites live in :designsystem and :feature-chat, which still run above).
      - name: Run Android verification task graph
        timeout-minutes: 55
        env:
          ADDITIVE_TASKS: ${{ steps.additive_modules.outputs.tasks }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/gradle-hang-watchdog.sh" 3120 "$RUNNER_TEMP/gradle-hang/diagnostics.txt" &
          watchdog=$!
          trap 'pkill -P "$watchdog" || true; kill "$watchdog" 2>/dev/null || true' EXIT
          tasks=(
            :app:compileSideloadDebugKotlin
            :core:android-data:testDebugUnitTest
            :app:testRootDebugUnitTest
            :build-logic:test
            checkArchitectureBoundaries
            :architecture-tests:test
            :architecture-tests:architectureTest
            :architecture-tests:structureReport
            :quality:detekt-rules:check
          )
          if [[ -n "${ADDITIVE_TASKS}" ]]; then
            read -r -a additive_tasks <<< "${ADDITIVE_TASKS}"
            tasks+=("${additive_tasks[@]}")
          fi
          ./gradlew "${tasks[@]}"

      - name: Upload Gradle hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-workload-hang-diagnostics
          path: ${{ runner.temp }}/gradle-hang/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce structural documentation limits
        working-directory: ${{ github.workspace }}
        env:
          STRUCTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s tools/structure_report/tests -v
          base="${STRUCTURE_BASE:-$(git rev-parse HEAD^)}"
          python3 tools/structure_report/structure_report.py --base-ref "$base"
          # The Gradle-free headroom scan (quick-check.sh) must count exactly what this export did.
          python3 -m unittest discover -s scripts/tests -p test_package_headroom.py -v
          python3 scripts/ci/package_headroom.py --compare android-compose/build/reports/structure/report.json

      - name: Upload generated structure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-structure-report
          path: |
            android-compose/build/reports/structure/index.html
            android-compose/build/reports/structure/report.json
          if-no-files-found: warn
          retention-days: 30

      # ci-speedup-pr2: the additive :sharedUI:jvmTest (412 files) and :desktop:test
      # (121 files + the Rust native/tablet_input build) suites moved out of this
      # job into the parallel shared-ui-desktop-tests job below. On main pushes and
      # sharedUI/desktop-touched PRs they ran sequentially on this single 4-vCPU
      # runner; they now run concurrently with the Android graph instead.

  # ci-speedup-pr2: the shared Compose UI and desktop JVM suites of the additive
  # module set, split from test-workload so they run in parallel instead of
  # serially on the Android test runner. It needs no other job (it starts with
  # test-workload and reports into required-test's pass/fail). Like api-contract
  # windows this job always reports green semantics: the resolve step always
  # runs, discovers the jvm-ui half of scripts/ci/changed-gradle-modules.sh
  # (always both suites on main pushes; on a PR only when the diff touches or
  # affects sharedUI/desktop — the skip rides step-level gates + a summary,
  # never a skipped job, because required-test rejects `skipped`).
  shared-ui-desktop-tests:
    name: shared-ui-desktop-tests
    runs-on: ubuntu-latest
    # The desktop suite has hung before (see shared-multiplatform); keep the
    # step-level watchdog as the early diagnostic signal and this as the backstop.
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: additive-module resolution diffs against the PR base sha.
          fetch-depth: 0

      - name: Setup Java 26
        # Same JDK as test-workload / shared-multiplatform (ci-speedup-pr1) so
        # Gradle build-cache entries stay under one JVM.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          # Only main saves; PRs restore the matching job's cache.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Ensure PR base for module-diff
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify -q "${BASE_SHA}^{commit}" >/dev/null; then
            exit 0
          fi
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" 2>/dev/null \
            || git fetch --no-tags origin "${BASE_REF}"

      - name: Resolve shared UI and desktop tests
        id: jvm_ui_scope
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != pull_request ]]; then
            tasks="$(./scripts/ci/changed-gradle-modules.sh --all --group jvm-ui)"
            echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
            echo "Shared UI + desktop JVM tests on ${EVENT_NAME}: ${tasks}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git rev-parse --verify -q "${BASE_SHA}^{commit}" >/dev/null; then
            base="${BASE_SHA}"
          else
            base="origin/${BASE_REF}"
          fi
          tasks="$(./scripts/ci/changed-gradle-modules.sh --group jvm-ui "$base")"
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
          if [[ -n "${tasks}" ]]; then
            echo "Shared UI + desktop JVM tests vs ${base}: ${tasks}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Shared UI + desktop JVM tests: skipped on this PR."
              echo "No file vs the PR base touches or (through dependency edges) affects \`sharedUI\` or \`desktop\`. The required \`test\` (test-workload) and \`shared-multiplatform\` jobs still gate the merge; main pushes always run both suites."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No sharedUI/desktop additive tasks vs ${base}; skipping the Gradle steps."
          fi

      - name: Install Linux hotkey build prerequisites for desktop tests
        if: contains(steps.jvm_ui_scope.outputs.tasks, ':desktop:')
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/apt-install-retry.sh" gcc pkg-config patch libx11-dev libglib2.0-dev xvfb xauth

      # :desktop:test triggers processResources, which stages BOTH Rust bridges
      # (desktop/build.gradle.kts): the pen bridge native/tablet_input (with the
      # vendored ../octotablet) and the Mermaid renderer native/mermaid_renderer
      # (resvg/fontdb). Cargo registry/git sources and both target dirs were
      # rebuilt from scratch every run otherwise. Key on both Cargo.lock so a
      # dependency bump misses exactly once. desktop.yml's Linux leg relies on
      # the runner's preinstalled cargo; no toolchain step is needed here.
      - name: Restore Cargo build state
        if: contains(steps.jvm_ui_scope.outputs.tasks, ':desktop:')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-compose/native/tablet_input/target
            android-compose/native/mermaid_renderer/target
          key: ${{ runner.os }}-cargo-desktop-native-v1-${{ hashFiles('android-compose/native/tablet_input/Cargo.lock', 'android-compose/native/mermaid_renderer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-native-v1-

      - name: Run shared UI and desktop JVM tests
        if: steps.jvm_ui_scope.outputs.tasks != ''
        timeout-minutes: 25
        env:
          ADDITIVE_TASKS: ${{ steps.jvm_ui_scope.outputs.tasks }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/gradle-hang-watchdog.sh" 1320 "$RUNNER_TEMP/gradle-hang/diagnostics.txt" &
          watchdog=$!
          trap 'pkill -P "$watchdog" || true; kill "$watchdog" 2>/dev/null || true' EXIT
          read -r -a tasks <<< "${ADDITIVE_TASKS}"
          ./gradlew "${tasks[@]}"

      - name: Upload Gradle hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-desktop-hang-diagnostics
          path: ${{ runner.temp }}/gradle-hang/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      # :sharedUI:jvmTest runs here since ci-speedup-pr2. Its Skiko UI tests can
      # fail on Linux alone (font metrics), and the console log carries neither
      # assertion messages nor stdout. Keep passing reports too, so selected
      # test methods and their verdicts remain independently verifiable.
      - name: Upload sharedUI JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharedui-jvmtest-reports-${{ github.run_id }}
          path: |
            android-compose/sharedUI/build/test-results/jvmTest/**
            android-compose/sharedUI/build/reports/tests/jvmTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload desktop JVM test reports
        # Same evidence policy as the sharedUI suite above: JUnit XML over
        # truncated console output.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jvmtest-reports-${{ github.run_id }}
          path: |
            android-compose/desktop/build/test-results/test/**
            android-compose/desktop/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7

  detekt:
    # letta-mobile-by4vm.32: honest static analysis. Every module's existing
    # findings are in its detekt-baseline.xml, so main is green and only a NEW
    # finding fails this job. Required on main since 2026-10-20 (branch
    # protection, scripts/bootstrap-branch-protection.sh): while advisory, findings
    # in files no PR touched merged and accumulated until #2134 cleared them.
    # Covers the Android modules (app, core:android-data, designsystem,
    # feature-chat), quality:detekt-rules and (letta-mobile-by4vm.65) every
    # src/<sourceSet>/kotlin dir of sharedLogic, sharedUI, plugin-view, desktop
    # and web (commonMain, jvmMain, androidMain, wasmJsMain, tests, ...).
    # The changed-file guardrailDetekt rules run inside the required `test` job.
    name: detekt
    # Runs after the other three required checks so they acquire runner
    # capacity first; it still reports wherever they report.
    needs: [test, shared-multiplatform, build-apk-pass]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-compose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 for detekt
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          # Only main saves; PRs restore without competing merge-ref snapshots.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Run detekt against the per-module baselines
        run: ./gradlew detekt --continue -Parchitecture.strict=true

      - name: Publish detekt summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## detekt"
            echo
            echo "Ran \`./gradlew detekt --continue -Parchitecture.strict=true\` (non-required)."
            echo "Findings already in a module's \`detekt-baseline.xml\` are ignored; anything new fails."
            echo "Fix it, or (deliberately) refresh the baseline with \`./gradlew detektBaseline\` on JDK 21."
            echo
            echo "Config: \`android-compose/detekt.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports-${{ github.run_id }}
          path: android-compose/**/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7

  row-parity:
    # Hard cut S9 (letta-mobile-ckmub.2.2): the shared sharedUI chat rows against
    # their committed goldens (feature-chat/src/test/snapshots/rows), rendered from
    # one fixture timeline at phone width, light and dark. Until S9 this compared
    # the legacy Android rows with the shared ones (S1/S4). Produces golden/shared/
    # diff PNGs and a row type -> pixel diff % table as an artifact and in the step
    # summary; the task fails when a row moves more than 2% from its golden.
    # Advisory (continue-on-error) while the goldens settle across platforms.
    name: row goldens (advisory)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        working-directory: android-compose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          # Only main saves; PRs restore the matching job's cache.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Render the shared chat rows against their goldens
        run: ./gradlew :feature-chat:rowGoldenReport

      - name: Publish row golden summary
        if: always()
        run: |
          report=feature-chat/build/outputs/roborazzi/row-parity/report.md
          {
            echo "## Chat row goldens (advisory)"
            echo
            if [ -f "$report" ]; then cat "$report"; else echo "No report was written."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload row golden images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-parity-${{ github.run_id }}
          path: android-compose/feature-chat/build/outputs/roborazzi/row-parity/**
          if-no-files-found: warn
          retention-days: 14

  shared-multiplatform:
    # Gates the KMP common code that Android, desktop (Windows), and future
    # platforms all consume. The `test` job only runs JVM/Android unit tests,
    # so JVM-only APIs (e.g. StringBuilder.delete, String.toByteArray) can leak
    # into commonMain/commonTest and ship green while breaking the Kotlin/Native
    # and desktop targets. This job compiles :sharedLogic for every configured
    # KMP target (including hostNative) and runs JVM/Android/desktop tests.
    # See letta-mobile-kx1r3 and letta-mobile-oi3od.
    # Healthy runs finish in ~10-14 minutes (the sharedLogic JVM suite alone is ~10-12). timeout-minutes is a backstop;
    # do not raise it to paper over a hung test process.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 26
        # Same JDK as test-workload / api-docs / web-wasm / build-apk (ci-speedup-pr1)
        # so Gradle build-cache entries are produced and consumed under one JVM:
        # test-workload already compiles this job's wasmJs/hostNative targets on
        # Java 26. detekt keeps JDK 21 (detekt 1.23.8 requires it).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          # Only main saves; PRs restore the matching job's cache.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Restore Konan (Kotlin/Native) toolchain
        id: konan
        # The K/N toolchain version is the catalog's kotlin version, so the key
        # is the catalog hash (letta-mobile-uwvx1). Saved only from main pushes
        # by the per-OS saver job below; PR-scoped entries would eat the quota.
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('android-compose/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run bounded sharedLogic JVM tests
        id: sharedlogic_jvm_tests
        # A Gradle test-process hang used to consume the whole job timeout and
        # discard the only evidence of which test was active. Bound this phase
        # so the always-run artifact step can preserve reports and daemon logs.
        continue-on-error: true
        run: timeout --preserve-status 16m ./gradlew :sharedLogic:jvmTest --info

      - name: Upload sharedLogic JVM test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharedlogic-jvmtest-diagnostics-${{ github.run_id }}
          path: |
            android-compose/sharedLogic/build/test-results/jvmTest/**
            android-compose/sharedLogic/build/reports/tests/jvmTest/**
            android-compose/build/reports/problems/**
            ~/.gradle/daemon/**
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when bounded sharedLogic JVM tests fail or hang
        if: steps.sharedlogic_jvm_tests.outcome != 'success'
        run: |
          echo "sharedLogic:jvmTest failed or exceeded its 12-minute diagnostic bound"
          exit 1

      - name: Run remaining shared multiplatform verification task graph
        env:
          RUN_NOTEBOOK_NATIVE_TESTS: "true"
        # Do not request :sharedLogic:allTests (hostNativeTest hangs) or
        # :desktop:test in this job — :desktop:test belongs to the
        # shared-ui-desktop-tests job and hung this one for the 25m timeout
        # when it still lived here (even when run before Konan). Native
        # compile still catches JVM-only API leaks in
        # commonMain/commonTest (b97bcf48). The wasmJs compiles catch breakage in
        # wasmJsMain/wasmJsTest and dependencies that ship no wasm artifact,
        # without making web-wasm required (letta-mobile-o4ygk.2). :sharedUI
        # compiles for wasm too, so JVM-only calls in the shared Compose UI fail
        # here (letta-mobile-o4ygk.4). :core:runtime owns its contract tests
        # (letta-mobile-by4vm.58): JVM run plus native/wasm test compiles.
        # apiCheck moved here from test-workload (ci-speedup-pr1): this job already
        # compiles the shared wasmJs/hostNative targets the ABI comparison depends
        # on, so the Android test runner no longer pays +3m09s of KMP compiles it
        # has no other use for. The comparison itself is the required
        # `shared-multiplatform` check, so API drift still blocks every merge.
        # ci-speedup-pr2: one invocation. The two sequential ones paid Gradle
        # startup + configuration twice (~4m43s total job) for two task batches
        # with no ordering requirement between them — Gradle fuses them into one
        # DAG here. The bounded :sharedLogic:jvmTest phase above stays separate:
        # it carries the timeout bound, continue-on-error and diagnostics trap.
        run: |
          ./gradlew :appserver-cli:test :appserver-cli:distZip :iroh-wrapper-cli:test :iroh-wrapper-cli:installDist :core:runtime:jvmTest :core:runtime:compileTestKotlinHostNative :core:runtime:compileTestKotlinWasmJs :sharedLogic:compileKotlinHostNative :sharedLogic:compileTestKotlinHostNative :sharedLogic:compileKotlinWasmJs :sharedLogic:compileTestKotlinWasmJs :sharedUI:compileKotlinWasmJs :sharedUI:compileTestKotlinWasmJs apiCheck
          node sharedLogic/karma.config.test.cjs

      # Moved with apiCheck from test-workload (ci-speedup-pr1): only apiCheck's
      # abi/android dump tasks write build/kotlin/abi and build/api-contract, so
      # this artifact uploads from the job that runs the check.
      - name: Upload actual API signatures for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-${{ github.sha }}
          path: |
            android-compose/**/build/kotlin/abi/**
            android-compose/**/build/api-contract/**
          # A missing dump is an error only when the job otherwise succeeded; after an earlier
          # failure the API step never ran, and a second "no files" error just hides the real one.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 7

      - name: Save Konan (Kotlin/Native) toolchain
        # Linux saver: the hostNative compiles pull the full Linux K/N toolchain.
        # success(), not always(): a failed or cancelled build must not save a
        # partial toolchain. An exact restore hit means nothing new to save.
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

  # The PR-description checks (shared-search line, web-bundle approval, test-weakening reason).
  # They moved out of test-workload so a description edit re-runs pr-body-policy.yml (~1 min)
  # instead of this graph; the same script runs here so the required `test` still blocks merge
  # on a missing line. On an edit, pr-body-policy.yml re-runs this job on the same head.
  pr-body-gate:
    name: pr-body-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the PR description checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/pr-body-policy.sh

  required-test:
    name: test
    runs-on: ubuntu-latest
    needs: [test, api-docs, api-contract-windows, web-wasm, pr-body-gate, shared-ui-desktop-tests]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require tests and documentation contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          BODY_RESULT: ${{ needs.pr-body-gate.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.api-docs.result }}
          WINDOWS_API_RESULT: ${{ needs.api-contract-windows.result }}
          WEB_RESULT: ${{ needs.web-wasm.result }}
          SHARED_UI_DESKTOP_RESULT: ${{ needs.shared-ui-desktop-tests.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$WINDOWS_API_RESULT" = success
          test "$WEB_RESULT" = success
          test "$SHARED_UI_DESKTOP_RESULT" = success
          # The description checks only exist on pull_request; anywhere else the job is skipped.
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$BODY_RESULT" = success
          else
            test "$BODY_RESULT" = skipped
          fi

  api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # ci-speedup-pr1: the Dokka HTML graph costs 18m31s per run. The tooling
      # checks below (service worker, KDoc hygiene, API package coverage, KDoc
      # baseline self-tests, wire contracts) stay on every PR and main push;
      # only the Gradle build + the checks that read its output are path-gated.
      # assemble-web-pages consumes the kotlin-api-docs artifact only on main,
      # where this gate is always open, so Pages never misses an upload.
      - name: Resolve whether the Dokka HTML build must run
        id: dokka_gate
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dokka HTML: full run (this is not a pull request)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" 2>/dev/null \
              || git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          fi
          if ! changed="$(git diff --name-only --diff-filter=ACMRD "${base}...HEAD")"; then
            echo "Dokka HTML: failed to diff ${base}...HEAD" >&2
            exit 1
          fi
          if grep -Eq '^android-compose/(sharedLogic|sharedUI|core/ids|core/runtime|plugin-api)/|^docs/|(^|/)Module\.md$|^scripts/ci/api-doc-undocumented-baseline\.txt$|^\.github/workflows/android\.yml$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dokka HTML: public-API/docs paths changed vs the PR base; running." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "Dokka HTML: skipped on this PR; the fast KDoc-hygiene, API-package-coverage and wire-contract checks all ran."
              echo "No file vs the PR base touches a public-API module (\`sharedLogic\`, \`sharedUI\`, \`core/ids\`, \`core/runtime\`, \`plugin-api\`), \`docs/**\`, a \`Module.md\` overview, the KDoc baseline, or this workflow. Main pushes always build the full reference."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Dokka HTML: skipped (no public-API/docs path changed vs ${base})"
          fi

      - name: Verify documentation tooling
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          node --test android-compose/web/service-worker.test.cjs
          python3 -m unittest discover -s scripts/tests -p test_api_doc_links.py -v
          python3 scripts/ci/check-api-package-coverage.py
          python3 -m unittest discover -s scripts/tests -p test_kdoc_hygiene.py -v
          python3 scripts/ci/check-kdoc-hygiene.py
          python3 -m unittest discover -s scripts/tests -p test_api_doc_undocumented.py -v
          python3 -m unittest discover -s scripts/tests -p test_api_doc_progress.py -v
          python3 -m unittest discover -s scripts/tests -p test_wire_contracts.py -v
          python3 scripts/ci/check-wire-contracts.py --check --diff-base "$DOCS_DIFF_BASE"
      - name: Setup Java 26
        if: steps.dokka_gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
        if: steps.dokka_gate.outputs.run == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
      - name: Restore Konan (Kotlin/Native) toolchain
        id: konan
        if: steps.dokka_gate.outputs.run == 'true'
        # Dokka configures :plugin-api:kotlinNativeBundleConfiguration and downloaded
        # kotlin-native-prebuilt live from Maven Central (HTTP 429, PR #2573). Restore
        # only: android.yml shared-multiplatform owns the main-push save of this key.
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('android-compose/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      # Finish the Android compiler's single-use JVM before starting the documentation graph.
      - name: Precompile shared Android API dependency
        if: steps.dokka_gate.outputs.run == 'true'
        working-directory: android-compose
        run: ./gradlew --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --console=plain :sharedLogic:compileAndroidMain
      - name: Generate shared API reference
        if: steps.dokka_gate.outputs.run == 'true'
        working-directory: android-compose
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PdokkaSourceRef=${{ github.sha }} --console=plain :dokkaGeneratePublicationHtml 2>&1 | tee dokka-diagnostics.log
      - name: Report documentation progress (advisory)
        if: steps.dokka_gate.outputs.run == 'true'
        continue-on-error: true
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/ci/api-doc-progress.py android-compose/dokka-diagnostics.log --diff-base "$DOCS_DIFF_BASE" --summary "$GITHUB_STEP_SUMMARY" --details android-compose/dokka-changed-file-gaps.txt
      - name: Enforce the shrinking KDoc baseline
        if: steps.dokka_gate.outputs.run == 'true'
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/ci/check-api-doc-undocumented.py android-compose/dokka-diagnostics.log --diff-base "$DOCS_DIFF_BASE"
      - name: Preserve Dokka diagnostics
        if: always() && steps.dokka_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dokka-diagnostics
          path: |
            android-compose/dokka-diagnostics.log
            android-compose/dokka-changed-file-gaps.txt
          if-no-files-found: error
          retention-days: 7
      - name: Check aggregate and module entry points
        if: steps.dokka_gate.outputs.run == 'true'
        run: |
          for module in . sharedLogic sharedUI core/ids core/runtime plugin-api; do
            test -s "android-compose/build/dokka/html/$module/index.html"
          done
      - name: Check authored links into the generated reference
        if: steps.dokka_gate.outputs.run == 'true'
        run: python3 scripts/ci/check-api-doc-links.py
      - uses: actions/upload-artifact@v4
        if: steps.dokka_gate.outputs.run == 'true'
        with:
          name: kotlin-api-docs
          path: android-compose/build/dokka/html/
          if-no-files-found: error
          retention-days: 30

  web-wasm:
    name: web-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ci-speedup-pr1: two scopes. The Rust checks (cargo fmt/test/clippy on
      # native/iroh-wasm) run on main pushes and PRs that touch the crate; the
      # heavy browser build (:web:wasmJsBrowserDistribution + wasmJsBrowserTest,
      # wasm-opt, 8m10s of it) plus the bundle-budget check run on main pushes and
      # PRs that touch the surface it compiles. App/feature/designsystem-only PRs
      # skip both and still report a green web-wasm to required-test; main always
      # runs everything.
      - name: Resolve WASM verification scope
        id: wasm_gates
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "web-wasm: full verification (this is not a pull request)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" 2>/dev/null \
              || git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          fi
          if ! changed="$(git diff --name-only --diff-filter=ACMRD "${base}...HEAD")"; then
            echo "web-wasm: failed to diff ${base}...HEAD" >&2
            exit 1
          fi
          rust=false
          heavy=false
          if grep -q '^android-compose/native/iroh-wasm/' <<<"$changed"; then
            rust=true
          fi
          if grep -Eq '^android-compose/(web|sharedUI|sharedLogic|plugin-api|core/runtime|gradle|build-logic|native/iroh-wasm)/|^\.github/workflows/android\.yml$' <<<"$changed"; then
            heavy=true
          fi
          echo "rust=${rust}" >> "$GITHUB_OUTPUT"
          echo "heavy=${heavy}" >> "$GITHUB_OUTPUT"
          if [ "$rust" = false ] && [ "$heavy" = false ]; then
            {
              echo "web-wasm: skipped on this PR."
              echo "No file vs the PR base touches \`native/iroh-wasm\`, the web client, the shared modules it compiles (\`sharedUI\`, \`sharedLogic\`, \`plugin-api\`, \`core/runtime\`), \`android-compose/gradle/**\`, \`build-logic/**\` or this workflow. Main pushes always run the full browser build."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "web-wasm: skipped (no wasm/web path changed vs ${base})"
          else
            echo "web-wasm scope (vs PR base): rust=${rust} heavy=${heavy}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Java 26
        if: steps.wasm_gates.outputs.heavy == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        if: steps.wasm_gates.outputs.heavy == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Setup Rust with WASM target
        if: steps.wasm_gates.outputs.rust == 'true' || steps.wasm_gates.outputs.heavy == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          targets: wasm32-unknown-unknown

      # Cargo registry/git sources and the iroh-wasm target dir were rebuilt from
      # scratch every run (and thrown away). Key on Cargo.lock so a dependency bump
      # misses exactly once; saved at job success by the cache action's post step.
      - name: Restore Cargo build state
        if: steps.wasm_gates.outputs.rust == 'true' || steps.wasm_gates.outputs.heavy == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-compose/native/iroh-wasm/target
          key: ${{ runner.os }}-cargo-iroh-wasm-v1-${{ hashFiles('android-compose/native/iroh-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-iroh-wasm-v1-

      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm_gates.outputs.heavy == 'true'
        # cargo install compiles the CLI from source (~111s every run); the official
        # 0.2.127 release tarball ships the same pinned binaries prebuilt (~3s).
        # If the release download fails, fall back to cargo install rather than
        # failing the job.
        run: |
          set -euo pipefail
          bindgen_dir="$RUNNER_TEMP/wasm-bindgen-0.2.127"
          mkdir -p "$bindgen_dir"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz"
          if curl -sSfL --retry 3 -o "$RUNNER_TEMP/wasm-bindgen.tar.gz" "$url"; then
            tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$bindgen_dir" --strip-components=1
            rm -f "$RUNNER_TEMP/wasm-bindgen.tar.gz"
            "$bindgen_dir/wasm-bindgen" --version
            echo "$bindgen_dir" >> "$GITHUB_PATH"
          else
            echo "prebuilt wasm-bindgen download failed; falling back to cargo install" >&2
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi

      - name: Verify Iroh WASM transport
        if: steps.wasm_gates.outputs.rust == 'true'
        working-directory: android-compose/native/iroh-wasm
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Test browser Iroh identity store
        # letta-mobile-wisqe S1: persistent, encrypted-at-rest browser identity (iroh-identity.js).
        # The job's default working-directory is android-compose/.
        run: node --test web/iroh-identity.test.mjs

      - name: Build and test Compose web client
        # The wasm test executable links all of sharedUI; at the repo-wide
        # 4 GiB Kotlin daemon heap it thrashes GC for ~50 min, then OOMs.
        if: steps.wasm_gates.outputs.heavy == 'true'
        timeout-minutes: 25
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/gradle-hang-watchdog.sh" 1320 "$RUNNER_TEMP/gradle-hang/diagnostics.txt" &
          watchdog=$!
          trap 'pkill -P "$watchdog" || true; kill "$watchdog" 2>/dev/null || true' EXIT
          ./gradlew :web:wasmJsBrowserDistribution :web:wasmJsBrowserTest \
            "-Pkotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Upload Gradle hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm-hang-diagnostics
          path: ${{ runner.temp }}/gradle-hang/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      # letta-mobile-hv54v: what a visitor downloads, per group, against
      # android-compose/web/bundle-budget.json (ceilings only come down).
      # Reads the :web:wasmJsBrowserDistribution output, so it runs only with it.
      - name: Check web bundle budget
        if: steps.wasm_gates.outputs.heavy == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../scripts/ci -p 'test_web_bundle_budget.py'
          status=0
          python3 ../scripts/ci/web-bundle-budget.py web/build/dist/wasmJs/productionExecutable \
            --summary-md build/web-bundle-budget.md || status=$?
          cat build/web-bundle-budget.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Locate WASM distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: wasm-dist
        run: |
          set -euo pipefail
          for candidate in \
            web/build/dist/wasmJs/productionExecutable \
            web/build/kotlin-webpack/wasmJs/productionExecutable \
            web/build/dist/wasmJs/developmentExecutable
          do
            if [ -f "$candidate/index.html" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              ls -la "$candidate"
              exit 0
            fi
          done
          echo "WASM dist with index.html not found" >&2
          find web/build -name index.html -print | head
          exit 1

      - name: Upload WASM site for combined Pages deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-site
          path: android-compose/${{ steps.wasm-dist.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  assemble-web-pages:
    name: assemble-web-pages
    needs: [web-wasm, api-docs, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-site
          path: public
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-api-docs
          path: public/api
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-structure-report
          path: public/structure
      - name: Verify site entry points
        run: test -s public/index.html && test -s public/api/index.html && test -s public/structure/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-web-pages:
    name: deploy-web-pages
    needs: assemble-web-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy WASM client and API reference to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    # The play-release leg (main pushes only: assemblePlayRelease + APK size/R8 validation) takes
    # 24-30 min on hosted runners (e.g. 29m41s on 99e0241c1, 2026-11-20); 25 cancelled a healthy run
    # on 006513558a and turned build-apk-pass red. 45 keeps a backstop above the observed maximum.
    timeout-minutes: 45
    # Deliberately independent of `test`: GitHub can fan out test, shared KMP
    # verification, and both APK variants as soon as the workflow starts. The
    # jobs restore warm state from prior trusted runs instead of serializing the
    # entire matrix for a same-run cache handoff. Keep build-apk-pass as the
    # stable required-check aggregator.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: root-debug
            gradle_task: :app:assembleRootDebug
            artifact_name: app-root-debug-apk
            artifact_path: android-compose/app/build/outputs/apk/root/debug/*.apk
          - variant: play-release
            gradle_task: :app:assemblePlayRelease
            artifact_name: app-play-release-apk
            artifact_path: android-compose/app/build/outputs/apk/play/release/*.apk
    defaults:
      run:
        working-directory: android-compose

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so build.gradle.kts can resolve
          # `git describe --tags` for the versionName fallback on
          # untagged-main / PR builds. Shallow clone returns no tags,
          # which would force the build to fall back to "0.0.0-dev".
          fetch-depth: 0

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          # Restore Gradle User Home state from prior trusted workflow runs;
          # keep all PR matrix consumers read-only and leave project-local state to the
          # separate same-repo-only cache below.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Restore project-local Gradle state
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/restore@v4
        with:
          # The exact key supports reruns of this commit; the restore prefix
          # supplies warm project state from earlier trusted commits. APK jobs
          # consume but never upload this state; the required test job owns saves.
          path: |
            android-compose/.gradle
            android-compose/.kotlin
            android-compose/**/build/intermediates/ksp
            android-compose/**/build/intermediates/incremental
          key: ${{ runner.os }}-gradle-project-v1-${{ hashFiles('android-compose/gradle/wrapper/gradle-wrapper.properties', 'android-compose/settings.gradle.kts', 'android-compose/**/*.gradle.kts', 'android-compose/gradle/libs.versions.toml', 'android-compose/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-project-v1-${{ hashFiles('android-compose/gradle/wrapper/gradle-wrapper.properties', 'android-compose/settings.gradle.kts', 'android-compose/**/*.gradle.kts', 'android-compose/gradle/libs.versions.toml', 'android-compose/gradle.properties') }}-

      # play-release builds only on main pushes: PR validation is covered by
      # root-debug (same compile surface); the signed R8 release build + size
      # gate runs post-merge. The matrix leg still reports success on PRs so
      # the build-apk-pass required aggregator stays satisfied.
      - name: Decode signing keystore
        if: matrix.variant == 'play-release' && github.event_name != 'pull_request'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/letta-release.jks

      - name: Build ${{ matrix.variant }} APK
        if: matrix.variant != 'play-release' || github.event_name != 'pull_request'
        env:
          SIGNING_STORE_FILE: ${{ matrix.variant == 'play-release' && 'letta-release.jks' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Self-hosted Sentry config. The Sentry Gradle plugin's upload
          # tasks (uploadSentryProguardMappingsRelease, sentryBundleSources*)
          # read these from the environment. PR builds validate that the APK
          # assembles, but they must not depend on remote Sentry uploads or on
          # a non-expired production token. Main-branch builds still receive
          # the secrets and upload mappings/source context.
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ github.event_name != 'pull_request' && secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ github.event_name != 'pull_request' && secrets.SENTRY_PROJECT || '' }}
          SENTRY_URL: ${{ github.event_name != 'pull_request' && secrets.SENTRY_URL || '' }}
        run: ./gradlew ${{ matrix.gradle_task }} --build-cache

      - name: Validate play-release APK size and R8 config
        if: matrix.variant == 'play-release' && github.event_name != 'pull_request'
        run: bash ../scripts/ci/validate-android-release-apk.sh

      - name: Remove signing keystore
        # Same hygiene as the release workflow -- runner is ephemeral but
        # don't leave the decoded keystore on disk longer than needed.
        if: always() && matrix.variant == 'play-release' && github.event_name != 'pull_request'
        run: rm -f app/letta-release.jks

      - name: Upload ${{ matrix.variant }} APK
        if: matrix.variant != 'play-release' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_number }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Builds the iroh-wrapper-cli distribution and uploads it as a CI artifact.
  # The wrapper connects the device (iroh-1.1.0) to the app-server; it MUST
  # match the iroh-ffi version used by the device APK, otherwise the QUIC
  # handshake fails with error 120 ("peer doesn't support any known protocol").
  # The artifact is downloaded on PR merge to redeploy into
  # /opt/meridian/iroh-wrapper/releases/<sha>/ via the deployment runbook.
  build-iroh-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-compose

    steps:
      # letta-mobile-2frn5: on a PR this job duplicated the wrapper build the
      # required shared-multiplatform job already performs
      # (:iroh-wrapper-cli:test and :iroh-wrapper-cli:installDist run there on
      # every PR and every main push), while its own artifact upload is
      # main-only. PRs now skip the Gradle build with a green step summary —
      # the required check keeps proving the wrapper assembles before merge,
      # and main pushes still build and upload the distribution for the
      # deployment runbook. Green-skip steps like api-contract-windows, never
      # a skipped job: build-iroh-wrapper-pass rejects `skipped`.
      - name: Resolve whether the wrapper distribution must build
        id: wrapper_scope
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "build-iroh-wrapper: full run (this is not a pull request)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          {
            echo "build-iroh-wrapper: skipped on this PR."
            echo "The required \`shared-multiplatform\` job runs \`:iroh-wrapper-cli:test\` and \`:iroh-wrapper-cli:installDist\` on every PR; the wrapper artifact builds and uploads on main pushes."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.wrapper_scope.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Setup Java 26
        # Same JDK as test-workload / api-docs / web-wasm / build-apk (ci-speedup-pr1)
        # so Gradle build-cache entries are produced and consumed under one JVM.
        if: steps.wrapper_scope.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        if: steps.wrapper_scope.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Build wrapper distribution
        if: steps.wrapper_scope.outputs.run == 'true'
        run: ./gradlew :iroh-wrapper-cli:installDist

      - name: Upload iroh-wrapper distribution
        if: steps.wrapper_scope.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: meridian-iroh-wrapper-${{ github.run_number }}
          path: android-compose/iroh-wrapper-cli/build/install/meridian-iroh-wrapper
          if-no-files-found: error

  # Aggregator job: reports a single stable status check that branch
  # protection can require. The `build-apk` job above runs as a matrix,
  # so each matrix entry produces its own check context whose name
  # includes all the matrix values
  # (e.g. "build-apk (root-debug, :app:assembleRootDebug, ...)").
  # GitHub branch-protection rules can't require a matrix-expanded
  # context cleanly -- the names truncate at 100 chars and change if
  # the matrix definition changes. This wrapper depends on the matrix
  # and reports as a single `build-apk-pass` context that's stable
  # against matrix edits and matches the bootstrap-branch-protection
  # script.
  build-apk-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-apk
    if: always()
    steps:
      - name: Verify build-apk matrix succeeded
        run: |
          result="${{ needs.build-apk.result }}"
          if [ "$result" != "success" ]; then
            echo "build-apk matrix did not succeed (result=$result)"
            exit 1
          fi
          echo "build-apk matrix succeeded"

  # Stable status check for branch protection that the shared KMP gate passed.
  shared-multiplatform-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: shared-multiplatform
    if: always()
    steps:
      - name: Verify shared-multiplatform succeeded
        run: |
          result="${{ needs.shared-multiplatform.result }}"
          if [ "$result" != "success" ]; then
            echo "shared-multiplatform did not succeed (result=$result)"
            exit 1
          fi
          echo "shared-multiplatform succeeded"

  # Stable status check for branch protection that the iroh-wrapper artifact
  # was built and uploaded. Required so the merge-train can't land a PR whose
  # wrapper was never produced — otherwise we'd rediscover the protocol-
  # mismatch at device runtime instead of at merge time.
  build-iroh-wrapper-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-iroh-wrapper
    if: always()
    steps:
      - name: Verify build-iroh-wrapper succeeded
        run: |
          result="${{ needs.build-iroh-wrapper.result }}"
          if [ "$result" != "success" ]; then
