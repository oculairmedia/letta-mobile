name: Android Perf Gate

# The emulator macrobenchmark (~30 min) is NOT a PR gate (letta-mobile perf
# nightly decision, 2026-10-15): it ran on every PR and throttled merges while
# its own noise band sat on the ceiling. It now measures main:
#   - nightly (schedule) and on every push to main that touches android-compose/
#   - on demand (workflow_dispatch, optionally in rebaseline mode)
#   - on a PR only when that PR edits the gate itself (this workflow,
#     android-compose/perf/**, android-compose/macrobenchmark/**) or opts in
#     with `[perf:rebaseline]` in its title.
# Every PR still runs the cheap `perf-scripts` job (perf script unit tests +
# Baseline Profile freshness, ~1 min, no emulator). A failed nightly/main run
# appends a regression report to the run's job summary for triage into a bead;
# no workflow here reports through GitHub Issues — issues are disabled on this
# repo on purpose (all work is tracked in beads), so an issue-based reporter
# can only add a second red job next to the real gate failure.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-perf.yml"
      - "android-compose/**"
  schedule:
    - cron: "0 7 * * *"
  pull_request:
    # pull_request.branches filters the PR *base*; stacked letta/**, feat/**
    # cursor/** and codex/** PRs get the perf-scripts self-test too.
    branches:
      - main
      - "letta/**"
      - "feat/**"
      - "cursor/**"
      - "codex/**"
  workflow_dispatch:
    inputs:
      rebaseline:
        description: "Seed/update android-compose/perf/baselines.json from this CI run"
        required: false
        default: false
        type: boolean

concurrency:
  # The event is part of the group so a main push never cancels the nightly
  # run (or the other way round); a newer push still supersedes an older one.
  # A main run is never cancelled, and its group carries the commit: a shared group would still
  # replace a *pending* main run (queue: single), so a burst of merges would drop commits' runs.
  group: android-perf-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # The breach control lists and downloads earlier main runs' perf summaries.
  actions: read

env:
  # Same Gradle User Home cache family as android.yml (ci-speedup-pr2): without
  # the prefix this optional workflow restored its own parallel default-prefix
  # gradle-home tree instead of the warm gh-v3 one the required workflows wrote.
  GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: gh-v3

jobs:
  # Cheap, emulator-free self-test of the gate. Runs on every event, PRs
  # included, and decides whether a PR opted into the macrobenchmark.
  perf-scripts:
    name: perf-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: android-compose
    outputs:
      run_benchmark: ${{ steps.classify.outputs.run_benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify performance impact
        id: classify
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          set -euo pipefail
          run_benchmark=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # PRs measure only when they change the gate itself or ask for a
            # rebaseline; everything else is measured nightly and on main.
            run_benchmark=false
            changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            if grep -Eq '^\.github/workflows/android-perf\.yml$|^android-compose/perf/|^android-compose/macrobenchmark/' <<<"$changed_files" \
              || [[ "$PR_TITLE" == *"[perf:rebaseline]"* ]]; then
              run_benchmark=true
            fi
          fi
          echo "run_benchmark=$run_benchmark" >> "$GITHUB_OUTPUT"
          echo "Macrobenchmark on this run: $run_benchmark (PRs: only gate edits or [perf:rebaseline]; otherwise nightly + main)" >> "$GITHUB_STEP_SUMMARY"

      # The checker and the control renderer are the gate. Keep them tested so
      # the gate itself cannot rot silently.
      - name: Test perf gate scripts
        run: python3 -m unittest discover -s perf -p 'test_*.py'

      # letta-mobile-by4vm.32: a Baseline Profile whose classes no longer exist
      # is silently ignored by ART, which shows up here as startup drift. Warn
      # (never fail) when too much of it no longer resolves.
      - name: Check Baseline Profile freshness
        run: |
          status=0
          python3 -u ../scripts/ci/baseline-profile-staleness.py --max-unresolved-pct 25 \
            > baseline-profile-staleness.txt 2>&1 || status=$?
          cat baseline-profile-staleness.txt
          if [[ "$status" -ne 0 ]]; then
            echo "::warning title=Stale Baseline Profile::$(grep -m1 '^unresolved:' baseline-profile-staleness.txt || tail -n 1 baseline-profile-staleness.txt) - regenerate it (docs/performance/perf-gate.md#baseline-profile-freshness)"
          fi
          {
            echo "## Baseline Profile freshness"
            echo
            echo '```text'
            cat baseline-profile-staleness.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  perf-gate:
    name: perf-gate
    needs: perf-scripts
    if: needs.perf-scripts.outputs.run_benchmark == 'true'
    runs-on: ubuntu-latest
    # Healthy runs take 36-47 min. The 2026-11-25 main run f460c90f hung for
    # ~53 min with no cap (GitHub's default job limit is 360) until a human
    # killed it. 60 ends the next hang as a clear job timeout instead; it
    # retries nothing (reruns stay a human decision, letta-mobile-by4vm.32).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-compose
    env:
      PERF_BENCHMARK_FILTER: |
        com.letta.mobile.macrobenchmark.StartupBenchmark#coldStartupCompilationPartial
        com.letta.mobile.macrobenchmark.StartupBenchmark#warmStartup
      PERF_OUTPUT_DIR: macrobenchmark/build/outputs/connected_android_test_additional_output
      PERF_REPORT_DIR: macrobenchmark/build/reports/androidTests
      PERF_SUMMARY_DIR: build/perf-summary
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      WORKFLOW_REBASELINE: ${{ inputs.rebaseline || false }}

    steps:
      # Step ids below exist so the report step at the end of the job can
      # name whichever step failed or timed out; they change no behavior.
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 26
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Optional benchmarks read required-job caches without adding copies.
          cache-read-only: true

      - name: Enable KVM group perms
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The 2026-11-25 hang lived in this exact step (run 45664445540 never
      # finished it). 50 covers the healthy worst case (47) and ends a hang as
      # a clear step timeout while the job keeps room (60) to still publish
      # its summaries and the regression report below.
      - name: Run macrobenchmarks on API 33 emulator
        id: macrobenchmark
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android-compose
          script: |
            rm -rf "$PERF_SUMMARY_DIR"; mkdir -p "$PERF_SUMMARY_DIR"
            FILTER=$(printf '%s\n' "$PERF_BENCHMARK_FILTER" | awk 'NF { printf "%s,", $0 } END { print "" }' | sed 's/,$//'); ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$FILTER"

      # One measurement decides (letta-mobile-by4vm.32). There is no automatic
      # rerun: retrying until green is what the deflake rule forbids. On a
      # breach the next step shows the control; a human decides whether to rerun.
      - name: Check perf baselines
        id: check_perf
        run: |
          set -euo pipefail
          mode=()
          if [[ "$WORKFLOW_REBASELINE" == "true" ]] || [[ "$PR_TITLE" == *"[perf:rebaseline]"* ]]; then
            mode=(--rebaseline)
          fi
          python3 perf/check_baselines.py "$PERF_OUTPUT_DIR" "${mode[@]}" \
            --summary-json "$PERF_SUMMARY_DIR/perf-summary.json" \
            --summary-md "$PERF_SUMMARY_DIR/perf-summary.md"

      - name: Publish perf summary
        id: publish
        if: always()
        run: |
          if [[ -f "$PERF_SUMMARY_DIR/perf-summary.md" ]]; then
            cat "$PERF_SUMMARY_DIR/perf-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the control (last 5 main runs) on a breach
        id: control
        if: failure() && steps.check_perf.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_DIR: ${{ runner.temp }}/perf-control
        run: |
          set -euo pipefail
          mkdir -p "$CONTROL_DIR"
          # Main's measurements: pushes to main and the nightly schedule.
          gh run list -R "$GITHUB_REPOSITORY" --workflow android-perf.yml --branch main \
            --status completed -L 40 \
            --json databaseId,headSha,conclusion,createdAt,url,event \
            | jq '[.[] | select(.event == "push" or .event == "schedule")
                       | select(.conclusion == "success" or .conclusion == "failure")][0:5]' \
            > "$CONTROL_DIR/runs.json"
          for id in $(jq -r '.[].databaseId' "$CONTROL_DIR/runs.json"); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'android-perf-summary-*' -D "$CONTROL_DIR/$id" 2>/dev/null \
              || gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'android-perf-results-*' -D "$CONTROL_DIR/$id" \
              || echo "::warning::no perf artifact for main run $id"
          done
          python3 perf/perf_control.py --current "$PERF_SUMMARY_DIR/perf-summary.json" \
            --runs "$CONTROL_DIR/runs.json" --control-dir "$CONTROL_DIR" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Small, separate artifact so a later breach's control step can fetch
      # five summaries without pulling five sets of traces.
      - name: Upload perf summary
        id: upload_summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-perf-summary-${{ github.run_number }}
          path: android-compose/${{ env.PERF_SUMMARY_DIR }}
          if-no-files-found: warn

      - name: Upload perf benchmark results
        id: upload_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-perf-results-${{ github.run_number }}
          path: |
            android-compose/${{ env.PERF_OUTPUT_DIR }}
            android-compose/${{ env.PERF_REPORT_DIR }}
            android-compose/${{ env.PERF_SUMMARY_DIR }}
            android-compose/perf/baselines.json
          if-no-files-found: warn

      - name: Upload rebaselined perf baselines
        id: upload_baselines
        if: always() && (inputs.rebaseline || contains(github.event.pull_request.title || '', '[perf:rebaseline]'))
        uses: actions/upload-artifact@v4
        with:
          name: android-perf-baselines-${{ github.run_number }}
          path: android-compose/perf/baselines.json
          if-no-files-found: error

      # Regression reporting, in the run's job summary. Issues are disabled on
      # this repo on purpose (all work is tracked in beads, AGENTS.md), so the
      # old `report-regression` job — which opened or commented on the
      # "perf-gate regression" issue — could only fail and add a second red
      # job next to the gate's real result. This step reports instead.
      - name: Report perf regression in the run summary
        id: report_regression
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed_steps="$(jq -r '[to_entries[]
              | select(.value.outcome == "failure" or .value.outcome == "cancelled")
              | .key] | join(", ")' <<<"$STEPS")"
          {
            echo "## perf-gate regression"
            echo
            echo "The Android Perf Gate failed."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Commit: ${SHA}"
            echo "- Failed or timed-out step(s): ${failed_steps:-none recorded — open the run log}"
            echo
            echo "Triage with docs/performance/perf-gate.md and file or update a bead."
          } >> "$GITHUB_STEP_SUMMARY"

  # Safety net for the one failure the step above cannot report: a job killed
  # by its `timeout-minutes: 60` runs no further steps, so nothing left in
  # perf-gate can append to the summary. This tiny job runs on every
  # perf-gate failure, reads this run's own job data (workflow permissions:
  # contents/actions read only — no write scope of any kind) and stays silent
  # when the step above already wrote the report, so the summary carries it
  # exactly once. A hung gate is never unreported.
  report-timeout-regression:
    name: report perf regression
    needs: perf-gate
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write a summary report for a timed-out or otherwise unreported gate failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Must match the in-job step name in `perf-gate` above, which is
          # looked up in this run's own job data to see whether it succeeded.
          report_step="Report perf regression in the run summary"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" 2>/dev/null || true)"
          already_reported=0
          failed_steps=""
          if [[ -n "$jobs" ]] && jq -e . >/dev/null 2>&1 <<< "$jobs"; then
            already_reported="$(jq -r --arg s "$report_step" '
              ([.jobs[] | select(.name == "perf-gate")][0].steps // [])
              | [.[] | select(.name == $s and .conclusion == "success")] | length' <<< "$jobs")"
            if [[ "${already_reported:-0}" == 0 ]]; then
              failed_steps="$(jq -r --arg s "$report_step" '
                [.jobs[] | select(.name == "perf-gate")][0]
                | [(.steps // [])[]
                   | select(.name != $s)
                   | select(.conclusion == "failure"
                         or .conclusion == "cancelled"
                         or ((.conclusion == null) and .status == "in_progress"))
                   | .name] | join(", ")' <<< "$jobs")"
            fi
          else
            echo "::warning::could not read this run's job data; writing a generic report."
          fi
          if [[ "${already_reported:-0}" != 0 ]]; then
            echo "perf-gate already reported the regression in its job summary; nothing to add."
            exit 0
          fi
          {
            echo "## perf-gate regression"
            echo
            echo "The Android Perf Gate failed and its own job could not write this"
            echo "report — most likely the job's \`timeout-minutes: 60\` killed it"
            echo "mid-step."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Commit: ${SHA}"
            echo "- Failed or timed-out step(s): ${failed_steps:-the one perf-gate was in when it was killed — see the run log}"
            echo
            echo "Triage with docs/performance/perf-gate.md and file or update a bead."
          } >> "$GITHUB_STEP_SUMMARY"
