# Managed by scripts/deploy/install-meridian.sh in oculairmedia/letta-mobile.
# Edit it there, not on the host: `install-meridian.sh --check` compares the two
# byte for byte, so a hand edit here shows up as drift and gets overwritten.
# See scripts/deploy/README-stall-diagnostics.md for the incident behind it.

# letta-mobile-jsfrn (2026-08-23). Companion to the App Server's protection.
# Under a host-wide swap storm BOTH processes stall together: the wrapper's QUIC
# keepalives stop (all Iroh peers time out) while the App Server misses pongs.
# Protecting only one half would still lose every peer connection.
# Current usage ~1.0GB (JVM, live set ~14MB but large mapped/committed footprint).
[Service]
MemoryLow=1500M

# BOUNDED 2026-09-12, alongside the App Server's cap. MemoryLow above protects
# this service from reclaim; nothing capped it, so a runaway here could take the
# host with it — not theoretical on this box, which reached load 119 with ~12GB
# swapped earlier that day.
#
# 3G is a blast-radius limit, not a target. The JVM is already self-limiting: a
# 1536M heap ceiling, and a full GC measured 916M -> 92M, so the live set is
# under 100MB against ~215MB RSS. 3G covers heap plus metaspace, thread stacks,
# direct buffers and the Iroh native side with room to spare.
#
# No MemoryHigh: throttling a QUIC bridge by forcing reclaim reproduces the
# stall this file exists to prevent, and would surface as transport latency —
# the symptom hardest to attribute.
MemoryMax=3G
