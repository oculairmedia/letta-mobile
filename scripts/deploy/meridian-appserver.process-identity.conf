# Repository template only: install through install-meridian.sh under deployment approval.
# Type=simple runs the App Server directly; MAINPID is that process, not a launcher.
[Service]
RuntimeDirectory=meridian-appserver
RuntimeDirectoryMode=0755
KillMode=control-group
ExecStartPost=/bin/sh -c 'umask 022; printf "%%s\\n" "${MAINPID}" > /run/meridian-appserver/main.pid'
