# Managed by scripts/deploy/install-meridian.sh in oculairmedia/letta-mobile.
# Edit it there, not on the host: `install-meridian.sh --check` compares the two
# byte for byte, so a hand edit here shows up as drift and gets overwritten.
# See scripts/deploy/README-stall-diagnostics.md for the incident behind it.

# letta-mobile-jsfrn (2026-08-23). Captured stall 15:50:48:
#   probe FAIL connect=3ms upgrade=-1 (TCP accepted by the kernel, but Node never
#   ran the upgrade handler for >10s), concurrent with load 30.64 at 70-83% IDLE
#   cpu, si=4540 pages/s swap-in and ~10.3GB already swapped. That evidence is
#   consistent with acute host reclaim/page-in pressure, not App Server CPU work;
#   it does not identify a specific Node page fault.
#
# vm.swappiness is already 1, so this host only swaps under genuine pressure;
# the missing piece is that neither meridian service had ANY reclaim protection
# (MemoryLow=0), so the App Server's pages were as evictable as a build's.
#
# MemoryLow (best-effort) rather than MemoryMin (hard guarantee): under real
# pressure the kernel should still be able to reclaim here as a last resort
# rather than OOM-killing something else on a busy 48GB host.
#
# RAISED 1G -> 3G after measuring a loaded App Server at 2.7GB RSS. The later
# 17:45 stall had the same probe signature but low swap activity (si=8) and was
# investigated separately as V8 heap/GC pressure. RSS is not V8 heap occupancy,
# and MemoryLow does not change the V8 ceiling; the 2.7GB measurement only showed
# that the original 1G floor protected the idle footprint (~440MB), not the
# realistic working set. Heap headroom is configured independently with
# --max-old-space-size.
[Service]
MemoryLow=3G

# BOUNDED 2026-09-12. MemoryLow above protects this service from reclaim, but
# nothing capped it: a runaway could take the host with it rather than dying
# alone. Not theoretical on this box, which reached load 119 with ~12GB swapped
# earlier that day.
#
# 6G is a blast-radius limit, not a target. Measured over 25,635 probe samples
# (scripts/deploy/stall-watchdog.sh records RSS every 20s): steady state
# 220-580MB depending on load, with three transient spikes to 1.2/1.2/1.6GB that
# each fell straight back, and no rising floor within any process lifetime. It
# also sits above the 2.7GB loaded-RSS measurement that motivated the 3G floor.
# Restart=always turns a cgroup kill into a reconnect rather than a wedged host.
#
# Deliberately NO MemoryHigh: MemoryHigh applies back-pressure by forcing
# reclaim, which is the mechanism behind the stall this file was created for. A
# hard ceiling that kills cleanly is safer here than throttling that stalls.
#
# Paired with --max-old-space-size in the environment file: keep the V8 ceiling
# BELOW this cap (4G against 6G today) so a runaway hits the JS heap limit and
# crashes cleanly instead of being killed by the kernel. Keep it ABOVE the
# measured working set (2.7GB) or a stall becomes a crash loop.
MemoryMax=6G
