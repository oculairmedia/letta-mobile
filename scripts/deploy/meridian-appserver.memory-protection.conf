# Repository-owned systemd template — letta-mobile-jsfrn.
# THIS FILE IS NOT THE LIVE UNIT. See scripts/deploy/README-stall-diagnostics.md
# for the install commands, the incident it exists for, and how to read its output.

# letta-mobile-jsfrn (2026-08-23). Captured stall 15:50:48:
#   probe FAIL connect=3ms upgrade=-1 (TCP accepted by the kernel, but Node never
#   ran the upgrade handler for >10s), concurrent with load 30.64 at 70-83% IDLE
#   cpu, si=4540 pages/s swap-in and ~10.3GB already swapped. That evidence is
#   consistent with acute host reclaim/page-in pressure, not App Server CPU work;
#   it does not identify a specific Node page fault.
#
# vm.swappiness is already 1, so this host only swaps under genuine pressure;
# the missing piece is that neither meridian service had ANY reclaim protection
# (MemoryLow=0), so the App Server's pages were as evictable as a build's.
#
# MemoryLow (best-effort) rather than MemoryMin (hard guarantee): under real
# pressure the kernel should still be able to reclaim here as a last resort
# rather than OOM-killing something else on a busy 48GB host.
#
# RAISED 1G -> 3G after measuring a loaded App Server at 2.7GB RSS. The later
# 17:45 stall had the same probe signature but low swap activity (si=8) and was
# investigated separately as V8 heap/GC pressure. RSS is not V8 heap occupancy,
# and MemoryLow does not change the V8 ceiling; the 2.7GB measurement only showed
# that the original 1G floor protected the idle footprint (~440MB), not the
# realistic working set. Heap headroom is configured independently with
# --max-old-space-size.
[Service]
MemoryLow=3G
