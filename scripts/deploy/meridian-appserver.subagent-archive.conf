# letta-mobile-sz671: move subagent agents idle for 7 days out of the local backend store before the
# App Server loads it. Runs on every start (deploys, upgrades, Restart=always), never while a server
# holds the store in memory. The leading "-" means a failure is logged and the server still starts.
# Restore one with: node /usr/local/lib/meridian/meridian-subagent-archive.cjs --restore <agent-id>
# (with the App Server stopped). Installed by install-meridian.sh.
[Service]
ExecStartPre=-/usr/bin/env node /usr/local/lib/meridian/meridian-subagent-archive.cjs --apply --days 7
