# Smoke: seeded-agent landing + create-new-agent reachability against the Iroh mini.
#
# Pre-conditions (operator runs BEFORE this flow):
#   1. Mini's wrapper is up and serving UDP Iroh (run start-test-appserver.sh).
#   2. scripts/test-sites/seed-test-site-agent.sh has been applied (so agents + their
#      conversation rows, including mini-sender and mini-with-tool, are present on disk).
#   3. Pixel is configured for Iroh transport — AUTOMATION_SERVER_URL injected
#      as iroh://<ticket> from the wrapper's startup log.
#
# This flow verifies:
#   (A) Seeded-state landing: the phone dials Iroh, Home lists the seeded agents and a recent
#       conversation, and tapping a seeded agent's orb opens a chat with its composer.
#   (B) Create-agent reachability: with agents already present, the header menu opens the
#       agent rail, its "New" button opens the new-conversation picker, whose "Create new agent"
#       action reaches the agent-creation surface (editor page with its Create/save button).
#       The flow stops before saving, so it creates nothing.
#
# Selectors are resource-ids. Text is used only where the element exposes no id: the rail's "New"
# button (content-description "New") and the picker's "Create new agent" row (the picker is a
# separate window whose testTags are not exported as resource-ids). Both are listed as missing ids.

appId: com.letta.mobile.dev
---
# --- (A) Seeded-state landing ---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home_page"
    timeout: 20000
# Home shows a mascot per agent and at least one recent conversation row (not a day label).
- assertVisible:
    id: "home_greeting_mascot_.+"
- assertVisible:
    id: "home_recent_(?!day_).+"
- assertNotVisible:
    id: "home_error"
# The seeded agents are orbs in the rail (the id carries the agent name from the mini backend).
- tapOn:
    id: "shell-header-menu"
- extendedWaitUntil:
    visible:
      id: "shell-agent-rail-orb-mini-sender"
    timeout: 10000
- assertVisible:
    id: "shell-agent-rail-orb-mini-with-tool"
- takeScreenshot: smoke-iroh-seeded-agents
# Open a seeded agent from its orb: the chat opens (the drawer closes itself) with its composer.
- tapOn:
    id: "shell-agent-rail-orb-mini-sender"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- assertVisible:
    id: "agent_identity_pill"

# --- (B) Create-agent path is still reachable with agents present ---
- tapOn:
    id: "shell-header-menu"
- extendedWaitUntil:
    visible:
      id: "shell-agent-rail"
    timeout: 10000
- tapOn: "New"
- extendedWaitUntil:
    visible: "Create new agent"
    timeout: 10000
- takeScreenshot: smoke-iroh-seeded-new-picker
- tapOn: "Create new agent"
- extendedWaitUntil:
    visible:
      id: "agent-editor-page"
    timeout: 10000
- assertVisible:
    id: "agent-editor-save"
- assertVisible:
    id: "settings-option-starter-blank"
- takeScreenshot: smoke-iroh-seeded-create-agent
